name: ZenPower
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH
    GAD_APPLICATION_IDENTIFIER: "ca-app-pub-9404799280370656~5633649402"
    GAD_BANNER_AD_UNIT_ID: "ca-app-pub-9404799280370656/9368502985"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.1.0"

targets:
  ZenPower:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ZenPower
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_NAME: ZenPower
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.zenpower
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ZenPower/Resources/Info.plist
    info:
      path: ZenPower/Resources/Info.plist
      properties:
        CFBundleDisplayName: "禅パワー"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        GADApplicationIdentifier: "$(GAD_APPLICATION_IDENTIFIER)"
        GADBannerAdUnitID: "$(GAD_BANNER_AD_UNIT_ID)"
        NSUserTrackingUsageDescription: "広告表示と効果測定のために使います。許可しなくてもアプリは使えます。"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
    scheme:
      testTargets: []
