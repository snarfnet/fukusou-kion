name: APNGStickerStudio
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.apngstickerstudio
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  APNGStickerStudio:
    type: application
    platform: iOS
    sources: [APNGStickerStudio]
    settings:
      base:
        PRODUCT_NAME: "アニメスタンプ作成 APNG Sticker Studio"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: APNGStickerStudio/Info.plist
      properties:
        CFBundleName: "アニメスタンプ作成 APNG Sticker Studio"
        CFBundleDisplayName: "アニメスタンプ作成 APNG Sticker Studio"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.photo-video
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "APNGに変換する画像を選ぶために使用します。画像は端末内だけで処理します。"
        NSPhotoLibraryAddUsageDescription: "作成したAPNGを書き出すために使用します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
