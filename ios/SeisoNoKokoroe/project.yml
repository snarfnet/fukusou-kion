name: SeisoNoKokoroe
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  SeisoNoKokoroe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SeisoNoKokoroe
    settings:
      base:
        PRODUCT_NAME: SeisoNoKokoroe
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.seisonokokoroe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SeisoNoKokoroe/Resources/Info.plist
    info:
      path: SeisoNoKokoroe/Resources/Info.plist
      properties:
        CFBundleDisplayName: "清掃の心得"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
    scheme:
      testTargets: []
