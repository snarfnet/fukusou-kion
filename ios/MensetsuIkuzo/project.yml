name: MensetsuIkuzo
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  MensetsuIkuzo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MensetsuIkuzo
    settings:
      base:
        PRODUCT_NAME: MensetsuIkuzo
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.mensetsuikuzo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: MensetsuIkuzo/Resources/Info.plist
    info:
      path: MensetsuIkuzo/Resources/Info.plist
      properties:
        CFBundleDisplayName: "面接行くぞい"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.photo-video
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "写真を選んで、面接用の服装や髪型を合成するために使います。写真は端末内だけで処理します。"
        NSPhotoLibraryAddUsageDescription: "作成した面接用フォトを写真アプリに保存するために使います。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
    scheme:
      testTargets: []
