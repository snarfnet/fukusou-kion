name: Aurum
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  Aurum:
    type: application
    platform: iOS
    sources:
      - Aurum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.aurum
        PRODUCT_NAME: Aurum
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Aurum/Resources/Info.plist
    scheme:
      testTargets: []
