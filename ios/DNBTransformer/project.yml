name: DNBTransformer
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "83VGKGSQUH"

targets:
  DNBTransformer:
    type: application
    platform: iOS
    sources:
      - path: DNBTransformer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.chop170
        INFOPLIST_FILE: DNBTransformer/Info.plist
        PRODUCT_NAME: DNBTransformer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "83VGKGSQUH"
    info:
      path: DNBTransformer/Info.plist
      properties:
        CFBundleDisplayName: CHOP//170
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "録音した音をドラムンベースに変換するためにマイクを使います。"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
