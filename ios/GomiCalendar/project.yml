name: GomiCalendar
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.gomicalendar
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  GomiCalendar:
    type: application
    platform: iOS
    sources: [GomiCalendar]
    settings:
      base:
        PRODUCT_NAME: GomiCalendar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: GomiCalendar/Info.plist
      properties:
        CFBundleName: "ごみ日カレンダー"
        CFBundleDisplayName: "ごみ日カレンダー"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: "現在地の住所から、ごみ収集エリアを確認するために使います。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
