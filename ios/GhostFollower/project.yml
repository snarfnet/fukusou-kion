name: GhostFollower
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"

targets:
  GhostFollower:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - GhostFollower
    resources:
      - GhostFollower/Resources
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_NAME: GhostFollower
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.ghostfollower
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: GhostFollower/Resources/Info.plist
    info:
      path: GhostFollower/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Ghost Follower"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: "ca-app-pub-9404799280370656~1621295319"
        GADDelayAppMeasurementInit: true
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: "cstr6suwn9.skadnetwork"
        NSPhotoLibraryAddUsageDescription: "幽霊を合成した動画を写真ライブラリへ保存します。"
        NSUserTrackingUsageDescription: "広告の表示と効果測定のために使用します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    scheme:
      testTargets: []
