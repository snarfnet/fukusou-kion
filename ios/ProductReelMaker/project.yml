name: ProductReelMaker
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  ProductReelMaker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ProductReelMaker
    settings:
      base:
        PRODUCT_NAME: ProductReelMaker
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.productreelmaker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: ProductReelMaker/Resources/Info.plist
    info:
      path: ProductReelMaker/Resources/Info.plist
      properties:
        CFBundleDisplayName: "商品リールメーカー"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.photo-video
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "商品紹介動画に使う写真を選ぶために使います。写真は端末内で処理します。"
        NSPhotoLibraryAddUsageDescription: "作成した商品紹介動画を写真アプリへ保存するために使います。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
    scheme:
      testTargets: []
