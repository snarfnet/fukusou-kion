name: ShopPromoBuilder
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.shoppromobuilder
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  ShopPromoBuilder:
    type: application
    platform: iOS
    sources:
      - ShopPromoBuilder
    resources:
      - path: ShopPromoBuilder/WebApp
        type: folder
    settings:
      base:
        PRODUCT_NAME: ShopPromoBuilder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ShopPromoBuilder/Info.plist
      properties:
        CFBundleName: "小さなお店の宣伝ツール"
        CFBundleDisplayName: "小さなお店の宣伝ツール"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
