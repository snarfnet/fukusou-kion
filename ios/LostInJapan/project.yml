name: LostInJapan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  LostInJapan:
    type: application
    platform: iOS
    sources:
      - path: LostInJapan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lostinjapan
        PRODUCT_NAME: Lost in Japan
        INFOPLIST_KEY_CFBundleDisplayName: Lost in Japan
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location helps find nearby police boxes and support desks.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose up to three photos that help identify your lost item.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a reference photo of your lost item.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
