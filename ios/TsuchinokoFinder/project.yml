name: TsuchinokoFinder
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  TsuchinokoFinder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TsuchinokoFinder
    resources:
      - TsuchinokoFinder/Assets.xcassets
      - TsuchinokoFinder/Resources/PrivacyInfo.xcprivacy
      - TsuchinokoFinder/Resources/ReviewSamples
    settings:
      base:
        PRODUCT_NAME: TsuchinokoFinder
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.tsuchinokofinder
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TsuchinokoFinder/Resources/Info.plist
    info:
      path: TsuchinokoFinder/Resources/Info.plist
      properties:
        CFBundleDisplayName: "\u30C4\u30C1\u30CE\u30B3\u5019\u88DC\u63A2\u77E5"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "\u8349\u3080\u3089\u3084\u5C71\u9053\u306E\u6620\u50CF\u304B\u3089\u30C4\u30C1\u30CE\u30B3\u5019\u88DC\u3092\u7AEF\u672B\u5185\u3067\u5224\u5B9A\u3059\u308B\u305F\u3081\u3001\u30AB\u30E1\u30E9\u3092\u4F7F\u7528\u3057\u307E\u3059\u3002"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    scheme:
      testTargets: []
