name: MottaCheck
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.mottacheck
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  MottaCheck:
    type: application
    platform: iOS
    sources: [MottaCheck]
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        INFOPLIST_FILE: MottaCheck/Info.plist
        PRODUCT_NAME: MottaCheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MottaCheck/Info.plist
      properties:
        CFBundleName: "忘れ物ゼロ"
        CFBundleDisplayName: "忘れ物ゼロ"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        NSUserTrackingUsageDescription: "広告の表示と効果測定のために使います。許可しなくてもアプリは使えます。"
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: "cstr6suwn9.skadnetwork"
          - SKAdNetworkIdentifier: "4fzdc2evr5.skadnetwork"
          - SKAdNetworkIdentifier: "2fnua5tdw4.skadnetwork"
          - SKAdNetworkIdentifier: "ydx93a7ass.skadnetwork"
