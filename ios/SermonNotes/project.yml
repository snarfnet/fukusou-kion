name: SermonNotes
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  SermonNotes:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SermonNotes
    settings:
      base:
        PRODUCT_NAME: SermonNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.sermonnotes
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SermonNotes/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SermonNotes/Resources/Info.plist
      properties:
        CFBundleDisplayName: "教会ノート"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
    scheme:
      testTargets: []
