name: SotsualRightTopMaker
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.sotsualrighttopmaker
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  SotsualRightTopMaker:
    type: application
    platform: iOS
    sources: [SotsualRightTopMaker]
    settings:
      base:
        PRODUCT_NAME: SotsualRightTopMaker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SotsualRightTopMaker/Info.plist
      properties:
        CFBundleName: "卒アル右上メーカー"
        CFBundleDisplayName: "卒アル右上メーカー"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.photo-video
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "欠席者枠に入れる写真を選ぶために使用します。写真は端末内だけで処理します。"
        NSPhotoLibraryAddUsageDescription: "作成した卒アル風画像を写真アプリに保存するために使用します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
