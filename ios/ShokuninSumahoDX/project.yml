name: ShokuninSumahoDX
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.shokuninsumahodx
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  ShokuninSumahoDX:
    type: application
    platform: iOS
    sources: [ShokuninSumahoDX]
    settings:
      base:
        INFOPLIST_FILE: ShokuninSumahoDX/Info.plist
        PRODUCT_NAME: ShokuninSumahoDX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ShokuninSumahoDX/Info.plist
      properties:
        CFBundleName: "職人スマホSuper DX"
        CFBundleDisplayName: "職人スマホSuper DX"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        NSPhotoLibraryUsageDescription: "現場写真に角度や中心線を重ねるために写真を読み込みます。"
        NSPhotoLibraryAddUsageDescription: "測定ラベルや中心線を重ねた写真を保存します。"
        NSMicrophoneUsageDescription: "手が使えない現場で測定メモを音声入力するためにマイクを使います。"
        NSSpeechRecognitionUsageDescription: "測定メモを音声から文字に変換するために音声認識を使います。"

  ShokuninSumahoDXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShokuninSumahoDXUITests]
    dependencies:
      - target: ShokuninSumahoDX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.shokuninsumahodx.uitests
