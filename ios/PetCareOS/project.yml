name: PetCareOS
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  PetCareOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PetCareOS
    resources:
      - path: PetCareOS/Assets.xcassets
      - path: PetCareOS/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: PetCareOS
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.petcareos
        INFOPLIST_FILE: PetCareOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
