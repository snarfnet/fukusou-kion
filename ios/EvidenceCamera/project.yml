name: EvidenceCamera
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "83VGKGSQUH"

targets:
  EvidenceCamera:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - EvidenceCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.evidencecamera
        INFOPLIST_FILE: EvidenceCamera/Resources/Info.plist
        PRODUCT_NAME: EvidenceCamera
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: EvidenceCamera/Resources/Info.plist
      properties:
        CFBundleDisplayName: "証拠カメラ"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "証拠写真を撮影するためにカメラを使います。"
        NSLocationWhenInUseUsageDescription: "撮影場所を証拠情報として記録するために位置情報を使います。"
        NSMotionUsageDescription: "撮影時の端末の傾きを記録するためにモーション情報を使います。"
        NSPhotoLibraryUsageDescription: "選んだ写真に埋め込まれた証拠データを確認するために写真ライブラリを使います。"
        NSPhotoLibraryAddUsageDescription: "必要に応じて撮影した証拠写真を書き出すために写真ライブラリを使います。"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  EvidenceCameraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - EvidenceCameraTests
    dependencies:
      - target: EvidenceCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.evidencecamera.tests
