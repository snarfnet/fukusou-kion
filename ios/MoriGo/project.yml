name: MoriGo
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.morigo
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic
targets:
  MoriGo:
    type: application
    platform: iOS
    sources:
      - path: MoriGo
        excludes: [Web]
      - path: MoriGo/Web
        type: folder
    settings:
      base:
        PRODUCT_NAME: MoriGo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MoriGo/Info.plist
      properties:
        CFBundleName: "もりの囲碁教室"
        CFBundleDisplayName: "もりの囲碁教室"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
  MoriGoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MoriGoTests]
    dependencies:
      - target: MoriGo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.morigo.tests
        CODE_SIGNING_ALLOWED: NO
