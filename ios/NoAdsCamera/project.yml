name: NoAdsCamera
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
targets:
  NoAdsCamera:
    type: application
    platform: iOS
    sources:
      - NoAdsCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.mastershotcamera
        INFOPLIST_FILE: NoAdsCamera/Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NoAdsCamera/Support/Info.plist
      properties:
        CFBundleDisplayName: MasterShot Camera
        CFBundleDevelopmentRegion: en
        CFBundleIconName: AppIcon
        NSCameraUsageDescription: "写真を撮影するためにカメラを使います。"
        NSPhotoLibraryAddUsageDescription: "撮影した写真をライブラリに保存します。"
        NSMicrophoneUsageDescription: "音や声を合図に撮影するためにマイクを使います。"
        NSSpeechRecognitionUsageDescription: "「はいチーズ」などの合図を検出するために音声認識を使います。"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
