name: VoiceprintInstallation
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.voiceprintinstallation
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  VoiceprintInstallation:
    type: application
    platform: iOS
    sources:
      - VoiceprintInstallation
    resources:
      - VoiceprintInstallation/Resources
    settings:
      base:
        INFOPLIST_FILE: VoiceprintInstallation/Info.plist
        PRODUCT_NAME: VoiceprintInstallation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: VoiceprintInstallation/Info.plist
      properties:
        CFBundleName: "Voiceprint"
        CFBundleDisplayName: "Voiceprint"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "声の波形、ピッチ、リズムから抽象アートを生成するために使います。録音音声は保存しません。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
