name: PianoPhraseLoop
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 83VGKGSQUH
    OTHER_LDFLAGS: "$(inherited) -ObjC"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0

targets:
  PianoPhraseLoop:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PianoPhraseLoop
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.pianophraseloop
        INFOPLIST_FILE: PianoPhraseLoop/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
