name: SimpleTrafficSurvey
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  SimpleTrafficSurvey:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SimpleTrafficSurvey
    resources:
      - SimpleTrafficSurvey/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: SimpleTrafficSurvey
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.simpletrafficsurvey
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SimpleTrafficSurvey/Resources/Info.plist
    info:
      path: SimpleTrafficSurvey/Resources/Info.plist
      properties:
        CFBundleDisplayName: "簡易交通量調査"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "通行人を検出して簡易的に人数を数えるため、カメラを使用します。映像は端末内で処理します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    scheme:
      testTargets: []
