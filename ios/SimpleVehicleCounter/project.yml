name: SimpleVehicleCounter
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  SimpleVehicleCounter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SimpleVehicleCounter
    resources:
      - SimpleVehicleCounter/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: SimpleVehicleCounter
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.simplevehiclecounter
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SimpleVehicleCounter/Resources/Info.plist
    info:
      path: SimpleVehicleCounter/Resources/Info.plist
      properties:
        CFBundleDisplayName: "簡易車両カウンター"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "車両の動きを検出して簡易的に台数を数えるため、カメラを使用します。映像は端末内で処理します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    scheme:
      testTargets: []
