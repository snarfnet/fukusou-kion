name: FukusouKion
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.fukusoukion
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: FukusouKion/FukusouKion.entitlements

targets:
  FukusouKion:
    type: application
    platform: iOS
    sources: [FukusouKion]
    settings:
      base:
        PRODUCT_NAME: FukusouKion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FukusouKion/Info.plist
      properties:
        CFBundleName: "服装気温"
        CFBundleDisplayName: "服装気温"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        NSLocationWhenInUseUsageDescription: "現在地の天気から、今日の服装を提案します。"
        NSUserTrackingUsageDescription: "広告の表示品質を上げるために使います。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
