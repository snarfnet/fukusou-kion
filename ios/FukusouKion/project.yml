name: FukusouKion
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.fukusoukion
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: FukusouKion/FukusouKion.entitlements
    GAD_APPLICATION_IDENTIFIER: "ca-app-pub-3940256099942544~1458002511"
    GAD_BANNER_AD_UNIT_ID: "ca-app-pub-3940256099942544/2435281174"
    GAD_INTERSTITIAL_AD_UNIT_ID: "ca-app-pub-3940256099942544/4411468910"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0

targets:
  FukusouKion:
    type: application
    platform: iOS
    sources: [FukusouKion]
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_NAME: FukusouKion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FukusouKion/Info.plist
      properties:
        CFBundleName: "服装気温"
        CFBundleDisplayName: "服装気温"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        GADApplicationIdentifier: "$(GAD_APPLICATION_IDENTIFIER)"
        GADBannerAdUnitID: "$(GAD_BANNER_AD_UNIT_ID)"
        GADInterstitialAdUnitID: "$(GAD_INTERSTITIAL_AD_UNIT_ID)"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
        NSLocationWhenInUseUsageDescription: "現在地の天気から、今日の服装を提案します。"
        NSUserTrackingUsageDescription: "広告の効果測定と、より関連性の高い広告表示のために使用します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
