name: FloraStitch
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  FloraStitch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FloraStitch
    settings:
      base:
        PRODUCT_NAME: FloraStitch
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.florastitch
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: FloraStitch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FloraStitch/Info.plist
      properties:
        CFBundleDisplayName: "Flora Stitch"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Import an image and convert it into a simple embroidery vector motif."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
    scheme:
      testTargets: []
