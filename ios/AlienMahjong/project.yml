name: AlienMahjong
options:
  bundleIdPrefix: com.originalgames
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AlienMahjong:
    type: application
    platform: iOS
    sources:
      - AlienMahjong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.moonshotmahjong
        DEVELOPMENT_TEAM: 83VGKGSQUH
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Moonshot Mahjong"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AlienMahjongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AlienMahjongTests
    dependencies:
      - target: AlienMahjong
schemes:
  AlienMahjong:
    build:
      targets:
        AlienMahjong: all
        AlienMahjongTests: [test]
    test:
      targets:
        - AlienMahjongTests
