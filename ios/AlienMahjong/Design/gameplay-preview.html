<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moonshot Mahjong — Gameplay Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#030611;color:#f2efdc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",sans-serif}
    .phone{position:relative;width:393px;height:852px;margin:0 auto;overflow:hidden;background:linear-gradient(145deg,#07102a,#100b2d 74%);padding:18px 18px 14px}
    .stars{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:37px 47px;transform:rotate(7deg)}
    .screen{position:relative;height:100%;display:flex;flex-direction:column;gap:10px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;font:800 9px/1.5 ui-monospace,SFMono-Regular,monospace;letter-spacing:1.15px}
    .muted{color:#f2efdc70}.status{color:#59eee2}
    .campaign{display:flex;gap:7px}.campaign i{height:4px;flex:1;border-radius:9px;background:#f2efdc20}.campaign i:nth-child(1){background:#59eee2}.campaign i:nth-child(2){background:#ff5c2e}
    .shield{font:800 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:1px}.shield-line{display:flex;justify-content:space-between;margin-bottom:5px}.bar{height:5px;border-radius:9px;background:#f2efdc18}.bar b{display:block;width:75%;height:100%;border-radius:9px;background:#59eee2}
    .portrait{position:relative;height:184px;border-radius:24px;overflow:hidden;border:1px solid #59eee244;box-shadow:0 0 28px #59eee226}
    .portrait img{width:100%;height:100%;object-fit:cover;object-position:center 24%}
    .portrait:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#07102ae8)}
    .id{position:absolute;z-index:2;left:14px;bottom:12px}.id strong{display:block;font:900 20px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:1px}.id span{font:800 8px ui-monospace,SFMono-Regular,monospace;letter-spacing:1.7px;color:#59eee2}
    .message{min-height:42px;text-align:center;font-weight:650;font-size:14px;display:grid;place-items:center;padding:0 20px;color:#f2efdcda}
    .table{flex:1;min-height:0;border:1px solid #59eee225;border-radius:26px;padding:14px 11px 12px;background:radial-gradient(circle at 50% 0,#163446,#081726 72%);box-shadow:inset 0 0 50px #0009}
    .table-label{text-align:center;font:800 8px ui-monospace,SFMono-Regular,monospace;letter-spacing:2px;color:#59eee288;margin-bottom:9px}
    .hand{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 5px}
    .tile{height:51px;border-radius:7px;background:#f2efdc;color:#09101b;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #bcb89f;font-weight:900;font-size:22px;position:relative}
    .tile small{font:900 7px ui-monospace,SFMono-Regular,monospace}.tile:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:#59eee2}.tile.o:after{background:#6655cc}.tile.b{color:#ff4c29}.tile.b:after{background:#ff5c2e}
    .draw{height:48px;border:0;border-radius:30px;background:#ff5c2e;color:#fff;font:900 12px ui-monospace,SFMono-Regular,monospace;letter-spacing:1.2px;margin-top:13px;width:100%}
    .earth .bar b{width:83%}
    .home{width:120px;height:4px;border-radius:9px;background:#fff8;margin:8px auto 0}
  </style>
</head>
<body>
  <main class="phone">
    <div class="stars"></div>
    <section class="screen">
      <header class="top"><div>FINAL TABLE // 2/4<br><span class="muted">REPTILIAN WARLORD • TURN 7</span></div><div class="status">YOUR TURN</div></header>
      <div class="campaign"><i></i><i></i><i></i><i></i></div>
      <div class="shield"><div class="shield-line"><span>VARAK</span><span>SHIELD 9/12</span></div><div class="bar"><b></b></div></div>
      <div class="portrait">
        <img src="../AlienMahjong/Assets.xcassets/ReptilianAlien.imageset/reptilian-alien.png" alt="">
        <div class="id"><span>REPTILIAN WARLORD</span><strong>VARAK</strong></div>
      </div>
      <div class="message">“Your moon belongs to the strongest hand.”</div>
      <div class="table">
        <div class="table-label">HUMANITY'S FINAL HAND</div>
        <div class="hand">
          <div class="tile b">🀇<small>1 MAN</small></div><div class="tile b">🀈<small>2 MAN</small></div><div class="tile b">🀉<small>3 MAN</small></div><div class="tile">🀐<small>1 SOU</small></div><div class="tile">🀑<small>2 SOU</small></div><div class="tile">🀒<small>3 SOU</small></div><div class="tile o">🀙<small>1 PIN</small></div>
          <div class="tile o">🀚<small>2 PIN</small></div><div class="tile o">🀛<small>3 PIN</small></div><div class="tile">🀀<small>EAST</small></div><div class="tile">🀀<small>EAST</small></div><div class="tile">🀀<small>EAST</small></div><div class="tile b">🀄<small>RED</small></div><div class="tile">🀅<small>GREEN</small></div>
        </div>
        <button class="draw">SELECT A TILE TO DISCARD</button>
      </div>
      <div class="shield earth"><div class="shield-line"><span>EARTH</span><span>SHIELD 10/12</span></div><div class="bar"><b></b></div></div>
      <div class="home"></div>
    </section>
  </main>
</body>
</html>
