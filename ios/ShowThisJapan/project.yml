name: ShowThisJapan
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ShowThisJapan:
    type: application
    platform: iOS
    sources:
      - path: ShowThisJapan
        excludes:
          - Resources
    resources:
      - path: ShowThisJapan/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.showthisjapan
        INFOPLIST_KEY_CFBundleDisplayName: Show This Japan
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location is used only when you request emergency location assistance.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - ShowThisJapanTests
  ShowThisJapanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShowThisJapanTests
    dependencies:
      - target: ShowThisJapan
