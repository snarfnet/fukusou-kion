name: ShowThisJapan
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ShowThisJapan:
    type: application
    platform: iOS
    sources:
      - path: ShowThisJapan
        excludes:
          - Resources
    resources:
      - path: ShowThisJapan/Resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.showthisjapan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ShowThisJapan/Info.plist
      properties:
        CFBundleDisplayName: Show This Japan
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Your location is used only when you request emergency location assistance.
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - ShowThisJapanTests
  ShowThisJapanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShowThisJapanTests
    dependencies:
      - target: ShowThisJapan
