name: WorldDressCamera
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH
targets:
  WorldDressCamera:
    type: application
    platform: iOS
    sources:
      - WorldDressCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.worlddresscamera
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: WorldDressCamera/Info.plist
      properties:
        CFBundleDisplayName: "民族衣装カメラ"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.photo-video
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "全身写真を撮影し、民族衣装と重ね合わせるためにカメラを使います。"
        NSPhotoLibraryUsageDescription: "民族衣装と重ねる写真を選ぶために写真ライブラリを使います。"
        NSPhotoLibraryAddUsageDescription: "作成した合成写真を写真ライブラリへ保存します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
