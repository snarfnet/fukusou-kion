name: SotsualRightTopMaker iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sotsual-right-top-maker-ios-build.yml"
      - "ios/SotsualRightTopMaker/**"

concurrency:
  group: sotsual-right-top-maker-ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/SotsualRightTopMaker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project SotsualRightTopMaker.xcodeproj \
            -scheme SotsualRightTopMaker \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
