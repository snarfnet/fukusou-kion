name: SaisunSnap TestFlight Upload

on:
  push:
    branches:
      - codex/saisunsnap-testflight
    paths:
      - ".github/workflows/saisunsnap-testflight.yml"
      - "ios/SaisunSnap/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version"
        required: true
        default: "1.0"
      build_number:
        description: "Build number. Leave blank to use the GitHub run number."
        required: false
        default: ""

concurrency:
  group: saisunsnap-testflight
  cancel-in-progress: false

jobs:
  upload-testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/SaisunSnap
    env:
      APP_BUNDLE_ID: com.tokyonasu.saisuncamera
      APP_NAME: "採寸カメラ"
      APP_SKU: saisun-camera-ios
      BUNDLE_NAME: SaisunSnap
      PROFILE_NAME: "SaisunSnap App Store"
      APP_VERSION: ${{ inputs.version || '1.0' }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Ensure Bundle ID and App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/ensure_asc_app.py | tee /tmp/saisunsnap-app.log
          grep '^APP_ID=' /tmp/saisunsnap-app.log >> "$GITHUB_ENV"

      - name: Create distribution certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
        shell: bash
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          . .venv/bin/activate
          python scripts/create_distribution_certificate.py | tee /tmp/saisunsnap-cert.log
          grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/saisunsnap-cert.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project SaisunSnap.xcodeproj \
            -scheme SaisunSnap \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          xcodebuild archive \
            -project SaisunSnap.xcodeproj \
            -scheme SaisunSnap \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SaisunSnap.xcarchive \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" exportOptions.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" exportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" exportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/SaisunSnap.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        shell: bash
        run: |
          set -o pipefail
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apple-id "$APP_ID" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/saisunsnap-altool-upload.log
          if grep -Eqi 'UPLOAD FAILED|Validation failed|STATE_ERROR|ERROR:' /tmp/saisunsnap-altool-upload.log; then
            exit 1
          fi

      - name: Wait for TestFlight processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaisunSnap-ipa
          path: ios/SaisunSnap/build/export/*.ipa
