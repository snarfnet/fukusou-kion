name: TrackedBubbleApp TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      register_only:
        description: "Only create or resolve the App Store Connect app, then stop before signing/build/upload"
        required: false
        default: "false"
      replace_distribution_certificate:
        description: "Delete existing distribution certificates if Apple blocks creating a CI certificate"
        required: false
        default: "false"
  push:
    branches:
      - codex/tracked-bubble-app-testflight
    paths:
      - ".github/workflows/tracked-bubble-app-testflight.yml"
      - "ios/TrackedBubbleApp/**"

concurrency:
  group: tracked-bubble-app-testflight
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/TrackedBubbleApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project TrackedBubbleApp.xcodeproj \
            -scheme TrackedBubbleApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            CODE_SIGNING_ALLOWED=NO

  upload-testflight:
    needs: build-smoke
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/TrackedBubbleApp
    env:
      APP_BUNDLE_ID: com.tokyonasu.trackedbubbleapp
      APP_NAME: "お目目キラキラ"
      APP_SKU: tracked-bubble-app-ios
      BUNDLE_NAME: TrackedBubbleApp
      PROFILE_NAME: "TrackedBubbleApp App Store"
      TRACKED_BUBBLE_APP_ID: ${{ secrets.TRACKED_BUBBLE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Install distribution certificate
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          REPLACE_DISTRIBUTION_CERTIFICATE: ${{ github.event.inputs.replace_distribution_certificate }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          if [ -n "$IOS_DISTRIBUTION_P12_BASE64" ]; then
            test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
            printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/distribution.p12
            CERT_SHA1=$(openssl pkcs12 -in /tmp/distribution.p12 -nokeys -clcerts -passin pass:"$IOS_DISTRIBUTION_P12_PASSWORD" | openssl x509 -noout -fingerprint -sha1 | sed 's/SHA1 Fingerprint=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')
            security import /tmp/distribution.p12 -k build.keychain -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
            echo "IOS_DISTRIBUTION_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
            rm /tmp/distribution.p12
          else
            . .venv/bin/activate
            python scripts/create_distribution_certificate.py | tee /tmp/tracked-bubble-app-cert.log
            grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/tracked-bubble-app-cert.log >> "$GITHUB_ENV"
            grep '^ASC_CERTIFICATE_ID=' /tmp/tracked-bubble-app-cert.log >> "$GITHUB_ENV"
          fi

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: |
          . .venv/bin/activate
          if [ -n "$TRACKED_BUBBLE_APP_ID" ]; then
            echo "APP_ID=$TRACKED_BUBBLE_APP_ID" >> "$GITHUB_ENV"
            python scripts/ensure_asc_app.py
          else
            python scripts/ensure_asc_app.py | tee /tmp/tracked-bubble-app.log
            if grep '^APP_ID=' /tmp/tracked-bubble-app.log >> "$GITHUB_ENV"; then
              echo "App Store Connect app resolved."
            else
              echo "App Store Connect app is not ready yet."
              echo "Create an app record for $APP_BUNDLE_ID, then add GitHub Secret TRACKED_BUBBLE_APP_ID."
              exit 1
            fi
          fi

      - name: Resolve app bundle
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/resolve_app_bundle.py | tee /tmp/tracked-bubble-app-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/tracked-bubble-app-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        if: ${{ github.event.inputs.register_only != 'true' }}
        run: xcodegen generate

      - name: Set build number
        if: ${{ github.event.inputs.register_only != 'true' }}
        run: |
          BUILD_NUM=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"

      - name: Archive
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project TrackedBubbleApp.xcodeproj \
            -scheme TrackedBubbleApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TrackedBubbleApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

      - name: Export and upload IPA
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/TrackedBubbleApp.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Wait for TestFlight build processing
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.BUILD_NUM }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrackedBubbleApp-xcarchive
          path: ios/TrackedBubbleApp/build/TrackedBubbleApp.xcarchive
          if-no-files-found: ignore
