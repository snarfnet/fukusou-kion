name: TroubleNavi iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - "ios/TroubleNavi/**"
      - ".github/workflows/trouble-navi-ios-build.yml"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/TroubleNavi

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
            sudo xcode-select -s "/Applications/$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project TroubleNavi.xcodeproj \
            -scheme TroubleNavi \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload generated project
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TroubleNavi-xcodeproj
          path: ios/TroubleNavi/TroubleNavi.xcodeproj
