name: TyphoonWatch iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/typhoon-watch-safe-deploy
    paths:
      - ".github/workflows/typhoon-watch-ios-build.yml"
      - "ios/TyphoonWatch/**"

concurrency:
  group: typhoon-watch-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/TyphoonWatch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project TyphoonWatch.xcodeproj \
            -scheme TyphoonWatch \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for compact iPhone Simulator
        run: |
          COMPACT_DEVICE_LINE=""
          COMPACT_DEVICE_ID=""
          COMPACT_DEVICE_LABEL=""
          EXISTING_SE_LINE=$(
            xcrun simctl list devices available |
              grep -E "^[[:space:]]+iPhone SE.*\\([0-9A-F-]{36}\\)" |
              head -n 1
          )
          if [ -n "$EXISTING_SE_LINE" ]; then
            COMPACT_DEVICE_LINE="$EXISTING_SE_LINE"
            COMPACT_DEVICE_LABEL="existing iPhone SE"
          else
            SE_DEVICE_TYPE=$(
              xcrun simctl list devicetypes |
                grep -E "iPhone SE.*\\(com\\.apple\\.CoreSimulator\\.SimDeviceType\\." |
                sed -E 's/.*\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\).*/\1/' |
                tail -n 1
            )
            IOS_RUNTIME=$(
              xcrun simctl list runtimes available |
                grep -E "iOS .*\\(com\\.apple\\.CoreSimulator\\.SimRuntime\\." |
                sed -E 's/.*\((com\.apple\.CoreSimulator\.SimRuntime\.[^)]+)\).*/\1/' |
                tail -n 1
            )
            if [ -n "$SE_DEVICE_TYPE" ] && [ -n "$IOS_RUNTIME" ]; then
              COMPACT_DEVICE_ID=$(
                xcrun simctl create "TyphoonWatch CI iPhone SE" "$SE_DEVICE_TYPE" "$IOS_RUNTIME"
              )
              COMPACT_DEVICE_LINE="TyphoonWatch CI iPhone SE ($COMPACT_DEVICE_ID)"
              COMPACT_DEVICE_LABEL="created iPhone SE"
            fi
          fi
          if [ -z "$COMPACT_DEVICE_LINE" ]; then
            for DEVICE_NAME in "iPhone 16e" "iPhone 17e"; do
              COMPACT_DEVICE_LINE=$(
                xcrun simctl list devices available |
                  grep -E "^[[:space:]]+$DEVICE_NAME.*\\([0-9A-F-]{36}\\)" |
                  head -n 1
              )
              if [ -n "$COMPACT_DEVICE_LINE" ]; then
                COMPACT_DEVICE_LABEL="compact fallback"
                break
              fi
            done
          fi
          if [ -z "$COMPACT_DEVICE_LINE" ]; then
            echo "No compact iPhone simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          if ! echo "$COMPACT_DEVICE_LABEL" | grep -q "iPhone SE"; then
            echo "::warning::No iPhone SE simulator found on this runner; using nearest compact iPhone simulator."
          fi
          if [ -z "$COMPACT_DEVICE_ID" ]; then
            COMPACT_DEVICE_ID=$(
              echo "$COMPACT_DEVICE_LINE" |
                sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
            )
          fi
          echo "Building on compact simulator ($COMPACT_DEVICE_LABEL): $COMPACT_DEVICE_LINE"
          xcodebuild build \
            -project TyphoonWatch.xcodeproj \
            -scheme TyphoonWatch \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$COMPACT_DEVICE_ID" \
            -derivedDataPath build/CompactDerivedData \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild test \
            -project TyphoonWatch.xcodeproj \
            -scheme TyphoonWatch \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$COMPACT_DEVICE_ID" \
            -derivedDataPath build/CompactDerivedData \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH="build/CompactDerivedData/Build/Products/Debug-iphonesimulator/TyphoonWatch.app"
          test -d "$APP_PATH"
          xcrun simctl boot "$COMPACT_DEVICE_ID" || true
          xcrun simctl bootstatus "$COMPACT_DEVICE_ID" -b
          xcrun simctl install "$COMPACT_DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$COMPACT_DEVICE_ID" com.tokyonasu.typhoonwatch
          sleep 8
          mkdir -p build/screenshots
          xcrun simctl io "$COMPACT_DEVICE_ID" screenshot build/screenshots/compact-iphone.png
          swift - <<'SWIFT'
          import CoreGraphics
          import Foundation
          import ImageIO

          let url = URL(fileURLWithPath: "build/screenshots/compact-iphone.png")
          guard
              let source = CGImageSourceCreateWithURL(url as CFURL, nil),
              let image = CGImageSourceCreateImageAtIndex(source, 0, nil)
          else {
              fatalError("Could not read compact screenshot.")
          }

          let width = image.width
          let height = image.height
          let bytesPerPixel = 4
          let bytesPerRow = width * bytesPerPixel
          var data = [UInt8](repeating: 0, count: height * bytesPerRow)

          guard let context = CGContext(
              data: &data,
              width: width,
              height: height,
              bitsPerComponent: 8,
              bytesPerRow: bytesPerRow,
              space: CGColorSpaceCreateDeviceRGB(),
              bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue
          ) else {
              fatalError("Could not create screenshot analysis context.")
          }

          context.draw(image, in: CGRect(x: 0, y: 0, width: width, height: height))

          var bright = 0
          var accent = 0
          var tealPanel = 0
          var sampledColors = Set<Int>()
          let total = width * height
          let sampleStep = max(1, total / 20_000)

          for index in 0..<total {
              let offset = index * bytesPerPixel
              let red = Int(data[offset])
              let green = Int(data[offset + 1])
              let blue = Int(data[offset + 2])

              if red > 185 && green > 185 && blue > 185 {
                  bright += 1
              }
              if red > 210 && green < 140 && blue < 120 {
                  accent += 1
              }
              if (35...115).contains(red) && (90...155).contains(green) && (95...165).contains(blue) {
                  tealPanel += 1
              }
              if index % sampleStep == 0 {
                  sampledColors.insert((red << 16) | (green << 8) | blue)
              }
          }

          let brightRatio = Double(bright) / Double(total)
          let accentRatio = Double(accent) / Double(total)
          let tealRatio = Double(tealPanel) / Double(total)
          print(String(format: "compact screenshot bright_ratio=%.4f accent_ratio=%.4f teal_ratio=%.4f sampled_unique_colors=%d", brightRatio, accentRatio, tealRatio, sampledColors.count))

          if brightRatio < 0.015 || accentRatio < 0.001 || tealRatio < 0.004 || sampledColors.count < 1800 {
              fatalError("Compact screenshot does not contain enough visible TyphoonWatch UI.")
          }
          SWIFT
          xcrun simctl shutdown "$COMPACT_DEVICE_ID" || true

      - name: Upload compact screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TyphoonWatch-compact-iphone-screenshot
          path: ios/TyphoonWatch/build/screenshots/compact-iphone.png
          if-no-files-found: error
