name: TyphoonWatch iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/typhoon-watch-safe-deploy
    paths:
      - ".github/workflows/typhoon-watch-ios-build.yml"
      - "ios/TyphoonWatch/**"

concurrency:
  group: typhoon-watch-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/TyphoonWatch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project TyphoonWatch.xcodeproj \
            -scheme TyphoonWatch \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for compact iPhone Simulator
        run: |
          COMPACT_DEVICE_LINE=""
          for DEVICE_NAME in "iPhone SE" "iPhone 16e" "iPhone 17e"; do
            COMPACT_DEVICE_LINE=$(
              xcrun simctl list devices available |
                grep -E "^[[:space:]]+$DEVICE_NAME.*\\([0-9A-F-]{36}\\)" |
                head -n 1
            )
            if [ -n "$COMPACT_DEVICE_LINE" ]; then
              break
            fi
          done
          if [ -z "$COMPACT_DEVICE_LINE" ]; then
            echo "No compact iPhone simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          if ! echo "$COMPACT_DEVICE_LINE" | grep -q "iPhone SE"; then
            echo "::warning::No iPhone SE simulator found on this runner; using nearest compact iPhone simulator."
          fi
          COMPACT_DEVICE_ID=$(
            echo "$COMPACT_DEVICE_LINE" |
              sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
          )
          echo "Building on compact simulator: $COMPACT_DEVICE_LINE"
          xcodebuild build \
            -project TyphoonWatch.xcodeproj \
            -scheme TyphoonWatch \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$COMPACT_DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
