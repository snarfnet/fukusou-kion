name: TyphoonWatch iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/typhoon-watch-safe-deploy
    paths:
      - ".github/workflows/typhoon-watch-ios-build.yml"
      - "ios/TyphoonWatch/**"

concurrency:
  group: typhoon-watch-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/TyphoonWatch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project TyphoonWatch.xcodeproj \
            -scheme TyphoonWatch \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for iPhone SE Simulator
        run: |
          SE_DEVICE_ID=$(
            xcrun simctl list devices available |
              grep -E 'iPhone SE.*\([0-9A-F-]{36}\)' |
              sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' |
              head -n 1
          )
          if [ -z "$SE_DEVICE_ID" ]; then
            echo "No available iPhone SE simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Building on iPhone SE simulator $SE_DEVICE_ID"
          xcodebuild build \
            -project TyphoonWatch.xcodeproj \
            -scheme TyphoonWatch \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SE_DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
