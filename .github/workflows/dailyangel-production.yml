name: DailyAngel Production

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/DailyAngel
    env:
      APP_BUNDLE_ID: com.tokyonasu.dailyangel
      APP_NAME: "天使の手紙"
      APP_SKU: dailyangel-ios
      BUNDLE_NAME: DailyAngel
      PROFILE_NAME: "DailyAngel App Store"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
            sudo xcode-select -s "/Applications/$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set build number
        run: |
          BUILD_NUM=$(( ${{ github.run_number }} + 1 ))
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"
          sed -i "" "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up ASC API Key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p ~/.appstoreconnect/private_keys /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 -D > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8

      - name: Install Python dependencies
        run: pip3 install --break-system-packages PyJWT cryptography requests

      - name: Create Distribution Certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          python3 scripts/create_distribution_certificate.py | tee /tmp/dailyangel-cert.log
          grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/dailyangel-cert.log >> "$GITHUB_ENV"

      - name: Ensure App Store Connect App
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          if [ -n "${{ secrets.DAILYANGEL_APP_ID }}" ]; then
            echo "APP_ID=${{ secrets.DAILYANGEL_APP_ID }}" >> "$GITHUB_ENV"
          else
            python3 scripts/ensure_asc_app.py | tee /tmp/dailyangel-ensure-app.log
            APP_ID_VALUE="$(grep '^APP_ID=' /tmp/dailyangel-ensure-app.log | tail -1 | cut -d= -f2)"
            test -n "$APP_ID_VALUE"
            echo "APP_ID=$APP_ID_VALUE" >> "$GITHUB_ENV"
          fi

      - name: Prepare Provisioning Profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: python3 scripts/prepare_profile.py

      - name: Build Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project DailyAngel.xcodeproj \
            -scheme DailyAngel \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DailyAngel.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/DailyAngel.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload IPA
        run: |
          IPA_PATH=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      - name: Submit for Review
        env:
          APP_ID: ${{ env.APP_ID }}
        run: python3 scripts/submit.py ${{ env.BUILD_NUM }}
