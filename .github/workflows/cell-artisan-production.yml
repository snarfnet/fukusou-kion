name: CellArtisan App Store Submit

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "TestFlight build number to submit"
        required: true
        default: "143"
      price_jpy:
        description: "Japan customer price in JPY"
        required: true
        default: "100"

concurrency:
  group: cell-artisan-production
  cancel-in-progress: false

jobs:
  submit-production:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/CellArtisan
    env:
      APP_BUNDLE_ID: com.tokyonasu.cellartisan
      APP_VERSION: "0.1"
      BUILD_NUMBER: ${{ inputs.build_number || '143' }}
      APP_PRICE_JPY: ${{ inputs.price_jpy || '100' }}
      CELL_ARTISAN_APP_ID: ${{ secrets.CELL_ARTISAN_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          chmod 600 "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8

      - name: Resolve App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
          APP_NAME: "たまにいるエクセル職人"
          APP_SKU: cell-artisan-ios
        run: |
          . .venv/bin/activate
          if [ -n "$CELL_ARTISAN_APP_ID" ]; then
            echo "APP_ID=$CELL_ARTISAN_APP_ID" >> "$GITHUB_ENV"
          else
            python scripts/ensure_asc_app.py | tee /tmp/cell-artisan-app.log
            grep '^APP_ID=' /tmp/cell-artisan-app.log >> "$GITHUB_ENV"
          fi

      - name: Submit to App Review
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/submit_production.py
