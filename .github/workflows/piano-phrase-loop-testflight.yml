name: PianoPhraseLoop TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version"
        required: true
        default: "1.0"
      build_number:
        description: "Build number. Leave blank to use the GitHub run number."
        required: false
        default: ""
      app_id:
        description: "Optional App Store Connect app ID."
        required: false
        default: ""
  push:
    branches:
      - codex/piano-phrase-loop-testflight
    paths:
      - ".github/workflows/piano-phrase-loop-testflight.yml"
      - "ios/PianoPhraseLoop/**"

concurrency:
  group: piano-phrase-loop-testflight
  cancel-in-progress: true

jobs:
  upload-testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/PianoPhraseLoop
    env:
      APP_BUNDLE_ID: com.tokyonasu.pianophraseloop
      APP_NAME: "ピアノフレーズ"
      APP_SKU: piano-phrase-loop-ios
      APP_ID: ${{ inputs.app_id || secrets.PIANO_PHRASE_LOOP_APP_ID || '' }}
      BUNDLE_NAME: PianoPhraseLoop
      PROFILE_NAME: "PianoPhraseLoop App Store"
      APP_VERSION: ${{ inputs.version || '1.0' }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Create distribution certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
          REPLACE_OLDEST_DISTRIBUTION_CERTIFICATE: "1"
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          . .venv/bin/activate
          python scripts/create_distribution_certificate.py | tee /tmp/piano-phrase-loop-cert.log
          grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/piano-phrase-loop-cert.log >> "$GITHUB_ENV"
          grep '^ASC_CERTIFICATE_ID=' /tmp/piano-phrase-loop-cert.log >> "$GITHUB_ENV"

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          if [ -n "$APP_ID" ]; then
            echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
            python scripts/ensure_asc_app.py
          else
            python scripts/ensure_asc_app.py | tee /tmp/piano-phrase-loop-app.log
            grep '^APP_ID=' /tmp/piano-phrase-loop-app.log >> "$GITHUB_ENV"
          fi

      - name: Resolve app bundle
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/resolve_app_bundle.py | tee /tmp/piano-phrase-loop-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/piano-phrase-loop-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Prepare bundled SoundFonts
        run: python scripts/prepare_soundfonts.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project PianoPhraseLoop.xcodeproj \
            -scheme PianoPhraseLoop \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PianoPhraseLoop.xcarchive \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/PianoPhraseLoop.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload IPA to App Store Connect
        run: |
          set -o pipefail
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apple-id "$APP_ID" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/piano-phrase-loop-altool.log
          if grep -Eqi 'UPLOAD FAILED|Validation failed|STATE_ERROR|ERROR:' /tmp/piano-phrase-loop-altool.log; then
            exit 1
          fi

      - name: Wait for TestFlight build processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Assign build to TestFlight groups
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          . .venv/bin/activate
          python scripts/assign_build_to_beta_groups.py

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PianoPhraseLoop-ipa
          path: ios/PianoPhraseLoop/build/export/*.ipa
          if-no-files-found: ignore
