name: ZenPower iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/zenpower-github-build
    paths:
      - ".github/workflows/zenpower-ios-build.yml"
      - "ios/ZenPower/project.yml"
      - "ios/ZenPower/ZenPower/**"
      - "ios/ZenPower/scripts/**"

concurrency:
  group: zenpower-ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/ZenPower

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ZenPower.xcodeproj \
            -scheme ZenPower

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project ZenPower.xcodeproj \
            -scheme ZenPower \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
