name: EvidenceCamera Production Submit

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Processed TestFlight build number to submit"
        required: true
        default: "107"
      price_jpy:
        description: "Japan App Store price"
        required: true
        default: "200"
      submit_review:
        description: "Submit to App Review after preparing metadata"
        required: true
        default: "true"

concurrency:
  group: evidence-camera-production
  cancel-in-progress: false

jobs:
  submit-production:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/EvidenceCamera
    env:
      APP_ID: ${{ secrets.EVIDENCE_CAMERA_APP_ID }}
      APP_VERSION: "1.0"
      BUILD_NUMBER: ${{ github.event.inputs.build_number }}
      APP_PRICE_JPY: ${{ github.event.inputs.price_jpy }}
      SUBMIT_REVIEW: ${{ github.event.inputs.submit_review }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests pillow

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$APP_ID"
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          chmod 600 /tmp/asc_key.p8

      - name: Submit production release
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/submit_production.py
