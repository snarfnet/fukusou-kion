name: FukusouKion Production Submit

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fukusou-kion-production

concurrency:
  group: fukusou-kion-production
  cancel-in-progress: true

jobs:
  submit-production:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/FukusouKion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_PRIVATE_KEY"
          mkdir -p /tmp/asc
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install signing assets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$IOS_APPSTORE_PROFILE_BASE64"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/distribution.p12
          security import /tmp/distribution.p12 -k build.keychain -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/FukusouKion_App_Store_AdMob.mobileprovision"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build number
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using build number $BUILD_NUMBER"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GAD_APPLICATION_IDENTIFIER: ${{ vars.GAD_APPLICATION_IDENTIFIER }}
          GAD_BANNER_AD_UNIT_ID: ${{ vars.GAD_BANNER_AD_UNIT_ID }}
          GAD_INTERSTITIAL_AD_UNIT_ID: ${{ vars.GAD_INTERSTITIAL_AD_UNIT_ID || 'disabled' }}
        run: |
          test -n "$GAD_APPLICATION_IDENTIFIER"
          test -n "$GAD_BANNER_AD_UNIT_ID"
          xcodebuild archive \
            -project FukusouKion.xcodeproj \
            -scheme FukusouKion \
            -destination "generic/platform=iOS" \
            -archivePath build/FukusouKion.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="FukusouKion App Store AdMob" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            GAD_APPLICATION_IDENTIFIER="$GAD_APPLICATION_IDENTIFIER" \
            GAD_BANNER_AD_UNIT_ID="$GAD_BANNER_AD_UNIT_ID" \
            GAD_INTERSTITIAL_AD_UNIT_ID="$GAD_INTERSTITIAL_AD_UNIT_ID"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/FukusouKion.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Ensure App Store Connect app record
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8_PATH: /tmp/asc_key.p8
          APP_BUNDLE_ID: com.tokyonasu.fukusoukion
          APP_NAME: "服装気温"
          APP_SKU: fukusoukion
          APP_VERSION: "1.0"
          PREPARE_APP_ONLY: "1"
        run: |
          . .venv/bin/activate
          python scripts/submit_production.py

      - name: Upload build to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/fukusou-kion-altool-upload.log
          ALTOOL_STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "UPLOAD FAILED|Validation failed|Failed to upload package" /tmp/fukusou-kion-altool-upload.log; then
            exit 1
          fi
          if [ "$ALTOOL_STATUS" -ne 0 ]; then
            exit "$ALTOOL_STATUS"
          fi

      - name: Submit production review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8_PATH: /tmp/asc_key.p8
          APP_BUNDLE_ID: com.tokyonasu.fukusoukion
          APP_NAME: "服装気温"
          APP_SKU: fukusoukion
          APP_VERSION: "1.0"
        run: |
          . .venv/bin/activate
          echo "Submitting build $BUILD_NUMBER"
          python scripts/submit_production.py
