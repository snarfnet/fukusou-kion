name: ProductReelMaker TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches:
      - codex/product-reel-maker-testflight
    paths:
      - ".github/workflows/product-reel-maker-testflight.yml"
      - "ios/ProductReelMaker/**"

concurrency:
  group: product-reel-maker-testflight
  cancel-in-progress: true

jobs:
  upload-testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/ProductReelMaker
    env:
      APP_BUNDLE_ID: com.tokyonasu.productreelmaker
      APP_NAME: "商品リールメーカー"
      APP_SKU: product-reel-maker-ios
      BUNDLE_NAME: ProductReelMaker
      PROFILE_NAME: "ProductReelMaker App Store"
      PRODUCT_REEL_MAKER_APP_ID: ${{ secrets.PRODUCT_REEL_MAKER_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Create distribution certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
          REPLACE_DISTRIBUTION_CERTIFICATE: "1"
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          . .venv/bin/activate
          python scripts/create_distribution_certificate.py | tee /tmp/product-reel-maker-cert.log
          grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/product-reel-maker-cert.log >> "$GITHUB_ENV"
          grep '^ASC_CERTIFICATE_ID=' /tmp/product-reel-maker-cert.log >> "$GITHUB_ENV"

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: |
          . .venv/bin/activate
          if [ -n "$PRODUCT_REEL_MAKER_APP_ID" ]; then
            echo "APP_ID=$PRODUCT_REEL_MAKER_APP_ID" >> "$GITHUB_ENV"
            python scripts/ensure_asc_app.py
          else
            python scripts/ensure_asc_app.py | tee /tmp/product-reel-maker-app.log
            if grep '^APP_ID=' /tmp/product-reel-maker-app.log >> "$GITHUB_ENV"; then
              echo "App Store Connect app resolved."
            else
              echo "App Store Connect app is not ready yet."
              echo "Create an app record for $APP_BUNDLE_ID, then add GitHub Secret PRODUCT_REEL_MAKER_APP_ID."
              exit 1
            fi
          fi

      - name: Resolve app bundle
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/resolve_app_bundle.py | tee /tmp/product-reel-maker-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/product-reel-maker-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build number
        run: |
          BUILD_NUM=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project ProductReelMaker.xcodeproj \
            -scheme ProductReelMaker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ProductReelMaker.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/ProductReelMaker.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Wait for TestFlight build processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.BUILD_NUM }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py
