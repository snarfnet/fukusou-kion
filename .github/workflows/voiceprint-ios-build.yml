name: Voiceprint iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/voiceprint-ios-build.yml"
      - "ios/VoiceprintInstallation/**"

jobs:
  build:
    name: Build Voiceprint
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        working-directory: ios/VoiceprintInstallation
        run: xcodegen generate

      - name: Build simulator app
        working-directory: ios/VoiceprintInstallation
        run: |
          xcodebuild \
            -project VoiceprintInstallation.xcodeproj \
            -scheme VoiceprintInstallation \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
