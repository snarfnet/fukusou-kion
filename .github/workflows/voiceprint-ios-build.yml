name: VoiceprintNFT iOS Build

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Archive and upload to TestFlight"
        required: false
        default: "false"
      submit_appstore:
        description: "Prepare metadata, screenshots, price, and submit to App Review"
        required: false
        default: "false"
      submit_build_number:
        description: "TestFlight build number to submit"
        required: false
        default: "31"
      price_jpy:
        description: "Japan base customer price in JPY"
        required: false
        default: "100"
  push:
    paths:
      - ".github/workflows/voiceprint-ios-build.yml"
      - "ios/VoiceprintInstallation/**"

jobs:
  build:
    name: Build VoiceprintNFT
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        working-directory: ios/VoiceprintInstallation
        run: xcodegen generate

      - name: Build simulator app
        working-directory: ios/VoiceprintInstallation
        run: |
          xcodebuild \
            -project VoiceprintInstallation.xcodeproj \
            -scheme VoiceprintInstallation \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == 'true'
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ios/VoiceprintInstallation
    env:
      APP_BUNDLE_ID: com.tokyonasu.voiceprintinstallation
      APP_NAME: VoiceprintNFT
      APP_SKU: voiceprint-ios
      BUNDLE_NAME: VoiceprintInstallation
      PROFILE_NAME: "VoiceprintNFT App Store"
      TEAM_ID: 83VGKGSQUH

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Set build number
        run: |
          BUILD_NUM=${{ github.run_number }}
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text()
          build = os.environ["GITHUB_RUN_NUMBER"]
          text = text.replace("CURRENT_PROJECT_VERSION: 1", f"CURRENT_PROJECT_VERSION: {build}")
          text = text.replace('CURRENT_PROJECT_VERSION: "1"', f'CURRENT_PROJECT_VERSION: "{build}"')
          path.write_text(text)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up ASC API Key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p ~/.appstoreconnect/private_keys /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 -D > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8

      - name: Install Python dependencies
        run: pip3 install --break-system-packages PyJWT cryptography requests

      - name: Create Distribution Certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-keychain-password' }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          python3 scripts/create_distribution_certificate.py | tee /tmp/voiceprint-cert.log
          grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/voiceprint-cert.log >> "$GITHUB_ENV"

      - name: Ensure App Store Connect App
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: python3 scripts/ensure_asc_app.py

      - name: Prepare Provisioning Profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: python3 scripts/prepare_profile.py

      - name: Build Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project VoiceprintInstallation.xcodeproj \
            -scheme VoiceprintInstallation \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/VoiceprintInstallation.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/VoiceprintInstallation.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload IPA to App Store Connect
        run: |
          IPA_PATH=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      - name: Wait for TestFlight Processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: python3 scripts/wait_for_testflight_build.py "$BUILD_NUM"

  appstore-submit:
    name: Submit to App Review
    if: github.event_name == 'workflow_dispatch' && inputs.submit_appstore == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios/VoiceprintInstallation
    env:
      APP_ID: "6777992670"
      APP_VERSION: "1.0"
      BUILD_NUMBER: ${{ inputs.submit_build_number || '31' }}
      APP_PRICE_JPY: ${{ inputs.price_jpy || '100' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew update
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Build screenshot app
        run: |
          xcodegen generate
          xcodebuild \
            -project VoiceprintInstallation.xcodeproj \
            -scheme VoiceprintInstallation \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture screenshots
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -path '*Debug-iphonesimulator/VoiceprintInstallation.app' -type d | head -1)
          test -n "$APP_PATH"
          . .venv/bin/activate
          python scripts/capture_screenshots.py "$APP_PATH" MarketingAssets/Screenshots

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          chmod 600 "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8

      - name: Submit to App Review
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/submit_production.py
