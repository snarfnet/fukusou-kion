name: KASANE TestFlight

on:
  workflow_dispatch:
    inputs:
      register_only:
        description: "Create or resolve the Bundle ID and App Store Connect app, then stop"
        required: false
        default: "false"
      replace_distribution_certificate:
        description: "Replace the oldest distribution certificate if Apple has reached its limit"
        required: false
        default: "false"
      version:
        description: "Marketing version"
        required: false
        default: "0.1.0"
      build_number:
        description: "Build number; blank uses GitHub run number plus 100"
        required: false
        default: ""

concurrency:
  group: kasane-testflight
  cancel-in-progress: false

jobs:
  upload-testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: kasane-ios
    env:
      APP_BUNDLE_ID: com.tokyonasu.kasane
      APP_NAME: KASANE
      APP_SKU: kasane-ios
      BUNDLE_NAME: KASANE
      PROFILE_NAME: "KASANE App Store"
      KASANE_APP_ID: ${{ secrets.KASANE_APP_ID }}
      KASANE_VERSION: ${{ inputs.version || '0.1.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Validate editorial data
        shell: pwsh
        run: ./editorial/validate-editorial.ps1 -BuildPublished

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Install distribution certificate
        if: ${{ inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
          REPLACE_DISTRIBUTION_CERTIFICATE: ${{ inputs.replace_distribution_certificate }}
          REPLACE_OLDEST_DISTRIBUTION_CERTIFICATE: "1"
          KASANE_STALE_CERTIFICATE_IDS: "H9S5D8B35K"
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          . .venv/bin/activate
          python scripts/create_distribution_certificate.py | tee /tmp/kasane-cert.log
          grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/kasane-cert.log >> "$GITHUB_ENV"
          grep '^ASC_CERTIFICATE_ID=' /tmp/kasane-cert.log >> "$GITHUB_ENV"

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: |
          . .venv/bin/activate
          if [ -n "$KASANE_APP_ID" ]; then
            echo "APP_ID=$KASANE_APP_ID" >> "$GITHUB_ENV"
            python scripts/ensure_asc_app.py
          else
            python scripts/ensure_asc_app.py | tee /tmp/kasane-app.log
            if grep '^APP_ID=' /tmp/kasane-app.log >> "$GITHUB_ENV"; then
              echo "App Store Connect app resolved."
            else
              echo "Create the app record for $APP_BUNDLE_ID, then add repository secret KASANE_APP_ID."
              exit 1
            fi
          fi

      - name: Resolve app bundle
        if: ${{ inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/resolve_app_bundle.py | tee /tmp/kasane-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/kasane-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        if: ${{ inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        if: ${{ inputs.register_only != 'true' }}
        run: xcodegen generate

      - name: Set build number
        if: ${{ inputs.register_only != 'true' }}
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then BUILD_NUM="${{ inputs.build_number }}"; else BUILD_NUM=$((GITHUB_RUN_NUMBER + 100)); fi
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"

      - name: Archive
        if: ${{ inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive -project KASANE.xcodeproj -scheme KASANE -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/KASANE.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$KASANE_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUM"

      - name: Export and upload IPA
        if: ${{ inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild -exportArchive -archivePath build/KASANE.xcarchive -exportPath build/export \
            -exportOptionsPlist export_options.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify TestFlight processing
        if: ${{ inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.BUILD_NUM }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KASANE-ipa
          path: kasane-ios/build/export/*.ipa
          if-no-files-found: ignore
