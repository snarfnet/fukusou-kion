name: FloraStitch App Store Submit

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "TestFlight build number to submit"
        required: true
        default: "116"
      app_id:
        description: "App Store Connect app ID"
        required: false
        default: "6782529525"
      price_jpy:
        description: "Japan customer price in JPY"
        required: true
        default: "200"

concurrency:
  group: flora-stitch-production
  cancel-in-progress: false

jobs:
  submit-production:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/FloraStitch
    env:
      APP_ID: ${{ inputs.app_id || '6782529525' }}
      APP_VERSION: "1.0"
      BUILD_NUMBER: ${{ inputs.build_number || '116' }}
      APP_PRICE_JPY: ${{ inputs.price_jpy || '200' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests pillow

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          chmod 600 "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8

      - name: Generate App Store screenshots
        run: |
          . .venv/bin/activate
          python scripts/generate_store_screenshots.py

      - name: Upload generated screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: flora-stitch-store-screenshots
          path: ios/FloraStitch/MarketingAssets/Screenshots

      - name: Submit to App Review
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          PYTHONUNBUFFERED: "1"
        run: |
          . .venv/bin/activate
          python scripts/submit_production.py
