name: Show This Japan Production Submission

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: TestFlight build number
        required: true
        default: "114"
  push:
    branches:
      - "codex/show-this-japan-testflight"
    paths:
      - ".github/workflows/show-this-japan-production.yml"
      - "ios/ShowThisJapan/scripts/submit_production.py"
      - "ios/ShowThisJapan/output/appstore-1284x2778/**"

jobs:
  submit-production:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/ShowThisJapan
    steps:
      - uses: actions/checkout@v4

      - name: Prepare App Store Connect credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > /tmp/asc_key.p8
          else
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > /tmp/asc_key.p8
          fi
          chmod 600 /tmp/asc_key.p8

      - name: Install API dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Configure USD 2.99 release and submit build
        env:
          BUILD_NUMBER: ${{ inputs.build_number || '114' }}
          APP_VERSION: "1.0"
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/submit_production.py").resolve()
          spec = importlib.util.spec_from_file_location("show_this_japan_submission", path)
          submission = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(submission)

          app_id = submission.base.find_app_id()
          version_id, _ = submission.base.find_or_create_version(app_id)
          build_id = submission.base.wait_for_build(app_id)
          submission.base.assign_build(version_id, build_id)

          response, body = submission.base.api_json(
              "GET", f"/apps/{app_id}/reviewSubmissions?limit=20"
          )
          submission.require_ok(response, "Review submission lookup")
          review = next(
              item for item in body["data"]
              if item["attributes"]["state"] in ("UNRESOLVED_ISSUES", "READY_FOR_REVIEW")
          )
          response, result = submission.base.api_json(
              "PATCH",
              f"/reviewSubmissions/{review['id']}",
              json={
                  "data": {
                      "type": "reviewSubmissions",
                      "id": review["id"],
                      "attributes": {"submitted": True},
                  }
              },
          )
          submission.require_ok(response, "Resubmit build 114")
          print(f"Submitted state: {result['data']['attributes']['state']}")
          PY
