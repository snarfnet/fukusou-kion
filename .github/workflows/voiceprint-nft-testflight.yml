name: VoiceprintNFT Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_existing_build_number:
        description: "Build number already uploaded to App Store Connect. Leave blank to build and upload a new IPA."
        required: false
        type: string
      upload_started_at:
        description: "Optional UTC timestamp for filtering builds, like 2026-06-11T10:42:29Z."
        required: false
        type: string
      wait_seconds:
        description: "Seconds to wait for App Store Connect build visibility."
        required: false
        default: "5400"
        type: string
  push:
    paths:
      - 'ios/VoiceprintInstallation/**'
      - '.github/workflows/voiceprint-nft-testflight.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_DIR: ios/VoiceprintInstallation
      SCHEME: VoiceprintNFT
      APP_ID: "6777992670"
      APP_BUNDLE_ID: com.tokyonasu.voiceprintinstallation
      PROFILE_NAME: "VoiceprintNFT App Store"
      SUBMIT_EXISTING_BUILD_NUMBER: ${{ inputs.submit_existing_build_number || '' }}
      UPLOAD_STARTED_AT: ${{ inputs.upload_started_at || '' }}
      WAIT_SECONDS: ${{ inputs.wait_seconds || '5400' }}
      BUILD_NUMBER: ${{ inputs.submit_existing_build_number || github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: env.SUBMIT_EXISTING_BUILD_NUMBER == ''
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -z "$SUBMIT_EXISTING_BUILD_NUMBER" ]; then
            brew install xcodegen
          fi
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Create signing keychain
        if: env.SUBMIT_EXISTING_BUILD_NUMBER == ''
        env:
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Generate Xcode project
        if: env.SUBMIT_EXISTING_BUILD_NUMBER == ''
        working-directory: ${{ env.APP_DIR }}
        run: xcodegen generate

      - name: Create distribution certificate
        if: env.SUBMIT_EXISTING_BUILD_NUMBER == ''
        working-directory: ${{ env.APP_DIR }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
          REPLACE_CURRENT_DISTRIBUTION: "1"
        run: |
          . .venv/bin/activate
          python scripts/create_distribution_certificate.py | tee /tmp/voiceprint-cert.log
          grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/voiceprint-cert.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        if: env.SUBMIT_EXISTING_BUILD_NUMBER == ''
        working-directory: ${{ env.APP_DIR }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$APP_BUNDLE_ID $PROFILE_NAME" exportOptions.plist

      - name: Build archive
        if: env.SUBMIT_EXISTING_BUILD_NUMBER == ''
        working-directory: ${{ env.APP_DIR }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project VoiceprintNFT.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -archivePath $RUNNER_TEMP/VoiceprintNFT.xcarchive \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Export IPA
        if: env.SUBMIT_EXISTING_BUILD_NUMBER == ''
        working-directory: ${{ env.APP_DIR }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/VoiceprintNFT.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        if: env.SUBMIT_EXISTING_BUILD_NUMBER == ''
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          echo "UPLOAD_STARTED_AT=$(date -u -v-5M '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apple-id "$APP_ID" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Wait for TestFlight build processing
        working-directory: ${{ env.APP_DIR }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Submit for review
        working-directory: ${{ env.APP_DIR }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python3 - << 'PYEOF'
          import jwt, time, requests, os
          from pathlib import Path

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          key = Path(os.environ["ASC_P8_PATH"]).read_text(encoding="utf-8")
          app_id = os.environ["APP_ID"]

          def token():
              return jwt.encode({"iss": issuer, "iat": int(time.time()), "exp": int(time.time())+1200, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": key_id})

          def api(method, path, **kw):
              url = f"https://api.appstoreconnect.apple.com/v1{path}"
              r = requests.request(method, url, headers={"Authorization": f"Bearer {token()}", "Content-Type": "application/json"}, **kw)
              print(f"{method} {path} -> {r.status_code}")
              if r.status_code >= 400: print(r.text[:500])
              return r

          def require_ok(response):
              if response.status_code >= 400:
                  raise RuntimeError(response.text[:500])
              return response

          def submit_version(version_id):
              existing = require_ok(api("GET", f"/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS&filter[state]=READY_FOR_REVIEW,UNRESOLVED_ISSUES&limit=10")).json().get("data", [])
              if existing:
                  submission_id = existing[0]["id"]
              else:
                  payload = {"data": {"type": "reviewSubmissions", "attributes": {"platform": "IOS"}, "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}}
                  submission_id = require_ok(api("POST", "/reviewSubmissions", json=payload)).json()["data"]["id"]
                  item_payload = {"data": {"type": "reviewSubmissionItems", "relationships": {"reviewSubmission": {"data": {"type": "reviewSubmissions", "id": submission_id}}, "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}}}}}
                  require_ok(api("POST", "/reviewSubmissionItems", json=item_payload))
              submit_payload = {"data": {"type": "reviewSubmissions", "id": submission_id, "attributes": {"submitted": True}}}
              require_ok(api("PATCH", f"/reviewSubmissions/{submission_id}", json=submit_payload))

          # Wait for build processing
          import time as t
          for attempt in range(30):
              r = api("GET", f"/apps/{app_id}/builds?limit=200")
              builds = sorted(r.json().get("data", []), key=lambda item: item.get("attributes", {}).get("uploadedDate") or "", reverse=True)
              min_uploaded_at = os.environ.get("UPLOAD_STARTED_AT", "")
              if min_uploaded_at:
                  from datetime import datetime
                  min_dt = datetime.fromisoformat(min_uploaded_at.replace("Z", "+00:00"))
                  builds = [item for item in builds if item.get("attributes", {}).get("uploadedDate") and datetime.fromisoformat(item["attributes"]["uploadedDate"]).astimezone(min_dt.tzinfo) >= min_dt]
              if builds:
                  build = next((item for item in builds if item.get("attributes", {}).get("version") == os.environ["BUILD_NUMBER"]), builds[0])
                  state = build["attributes"].get("processingState", "")
                  valid = build["attributes"].get("valid", False)
                  print(f"  Build state: {state}, valid: {valid}")
                  if state == "VALID":
                      break
              t.sleep(30)

          # Get version and submit
          r = api("GET", f"/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=1")
          versions = r.json().get("data", [])
          if versions:
              vid = versions[0]["id"]
              state = versions[0]["attributes"]["appStoreState"]
              print(f"Version {vid} state: {state}")
              if state in ("PREPARE_FOR_SUBMISSION", "INVALID_BINARY", "DEVELOPER_REJECTED"):
                  # Link build
                  r2 = api("GET", f"/apps/{app_id}/builds?limit=200")
                  if r2.json().get("data"):
                      min_uploaded_at = os.environ.get("UPLOAD_STARTED_AT", "")
                      build_items = sorted(r2.json()["data"], key=lambda item: item.get("attributes", {}).get("uploadedDate") or "", reverse=True)
                      if min_uploaded_at:
                          from datetime import datetime
                          min_dt = datetime.fromisoformat(min_uploaded_at.replace("Z", "+00:00"))
                          build_items = [item for item in build_items if item.get("attributes", {}).get("uploadedDate") and datetime.fromisoformat(item["attributes"]["uploadedDate"]).astimezone(min_dt.tzinfo) >= min_dt]
                      if not build_items:
                          raise RuntimeError("No uploaded build found for this workflow run.")
                      build = next((item for item in build_items if item.get("attributes", {}).get("version") == os.environ["BUILD_NUMBER"]), build_items[0])
                      build_id = build["id"]
                      require_ok(api("PATCH", f"/appStoreVersions/{vid}", json={"data": {"type": "appStoreVersions", "id": vid, "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}}))
                  submit_version(vid)
          PYEOF
