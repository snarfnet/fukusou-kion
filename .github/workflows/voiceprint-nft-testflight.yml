name: VoiceprintNFT Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/VoiceprintInstallation/**'
      - '.github/workflows/voiceprint-nft-testflight.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_DIR: ios/VoiceprintInstallation
      SCHEME: VoiceprintNFT
      APP_ID: "6777992670"

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.APP_DIR }}
        run: xcodegen generate

      - name: Install Apple certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$P12_BASE64" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build archive
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodebuild archive \
            -project VoiceprintNFT.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -archivePath $RUNNER_TEMP/VoiceprintNFT.xcarchive \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=FHBV2X93N8 \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/export.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>FHBV2X93N8</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/VoiceprintNFT.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_CONTENT" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/VoiceprintNFT.ipa" \
            -t ios \
            --apiKey $ASC_KEY_ID \
            --apiIssuer $ASC_ISSUER_ID

      - name: Submit for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          pip3 install pyjwt requests
          python3 - << 'PYEOF'
          import jwt, time, requests, os

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          key = os.environ["ASC_KEY_CONTENT"]
          app_id = "6777992670"

          def token():
              return jwt.encode({"iss": issuer, "iat": int(time.time()), "exp": int(time.time())+1200, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": key_id})

          def api(method, path, **kw):
              url = f"https://api.appstoreconnect.apple.com/v1{path}"
              r = requests.request(method, url, headers={"Authorization": f"Bearer {token()}", "Content-Type": "application/json"}, **kw)
              print(f"{method} {path} -> {r.status_code}")
              if r.status_code >= 400: print(r.text[:500])
              return r

          # Wait for build processing
          import time as t
          for attempt in range(30):
              r = api("GET", f"/apps/{app_id}/builds?sort=-uploadedDate&limit=1")
              builds = r.json().get("data", [])
              if builds:
                  state = builds[0]["attributes"].get("processingState", "")
                  valid = builds[0]["attributes"].get("valid", False)
                  print(f"  Build state: {state}, valid: {valid}")
                  if state == "VALID" and valid:
                      break
              t.sleep(30)

          # Get version and submit
          r = api("GET", f"/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=1")
          versions = r.json().get("data", [])
          if versions:
              vid = versions[0]["id"]
              state = versions[0]["attributes"]["appStoreState"]
              print(f"Version {vid} state: {state}")
              if state in ("PREPARE_FOR_SUBMISSION", "INVALID_BINARY"):
                  # Link build
                  r2 = api("GET", f"/apps/{app_id}/builds?sort=-uploadedDate&limit=1")
                  if r2.json().get("data"):
                      build_id = r2.json()["data"][0]["id"]
                      api("PATCH", f"/appStoreVersions/{vid}", json={"data": {"type": "appStoreVersions", "id": vid, "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}})
                  api("POST", f"/appStoreVersionSubmissions", json={"data": {"type": "appStoreVersionSubmissions", "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": vid}}}}})
          PYEOF
