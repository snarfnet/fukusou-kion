name: TYPO distribution preparation
on:
  push:
    branches: [codex/typo-testflight]
    paths: [".github/workflows/typo-register.yml", "ios/TYPO/Tools/register_bundle.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install PyJWT cryptography requests
      - name: Register TYPO bundle and inspect distribution readiness
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          APNG_P12: ${{ secrets.APNG_IOS_DISTRIBUTION_P12_BASE64 }}
          APNG_PASSWORD: ${{ secrets.APNG_IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          python - <<'PY'
          import os, time, jwt, requests, base64
          from cryptography.hazmat.primitives.serialization import pkcs12
          from cryptography.hazmat.primitives import hashes
          from cryptography import x509
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              os.environ["ASC_PRIVATE_KEY"], algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          session = requests.Session()
          session.headers["Authorization"] = "Bearer " + token
          base = "https://api.appstoreconnect.apple.com/v1"
          response = session.get(base + "/bundleIds", params={"filter[identifier]": "com.tokyonasu.typo"}, timeout=60)
          response.raise_for_status()
          bundles = response.json()["data"]
          if not bundles:
              response = session.post(base + "/bundleIds", json={"data": {"type": "bundleIds", "attributes": {
                  "identifier": "com.tokyonasu.typo", "name": "TYPO", "platform": "IOS"
              }}}, timeout=60)
              response.raise_for_status()
          print("Bundle ID ready: com.tokyonasu.typo")
          response = session.get(base + "/apps", params={"filter[bundleId]": "com.tokyonasu.typo"}, timeout=60)
          response.raise_for_status()
          apps = response.json()["data"]
          print("App ready: " + apps[0]["id"] if apps else "App record must be created in App Store Connect.")
          response = session.get(base + "/certificates", params={"filter[certificateType]": "DISTRIBUTION,IOS_DISTRIBUTION", "limit": 200}, timeout=60)
          response.raise_for_status()
          live = response.json()["data"]
          fingerprints = {}
          for cert in live:
              print("Distribution certificate:", cert["id"], "expires", cert["attributes"].get("expirationDate"))
              content = cert["attributes"].get("certificateContent")
              if content:
                  fingerprints[x509.load_der_x509_certificate(base64.b64decode(content)).fingerprint(hashes.SHA256())] = cert["id"]
          for prefix in ["IOS", "APNG"]:
              if os.environ.get(prefix + "_P12"):
                  try:
                      key, cert, chain = pkcs12.load_key_and_certificates(
                          base64.b64decode(os.environ[prefix + "_P12"]),
                          os.environ[prefix + "_PASSWORD"].encode())
                      match = fingerprints.get(cert.fingerprint(hashes.SHA256())) if cert else None
                      print(prefix + " stored signing identity:", "active " + match if match and key else "not among active certificates")
                  except Exception:
                      print(prefix + " stored signing identity: could not decode")
          PY
