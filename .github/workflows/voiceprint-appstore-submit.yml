name: VoiceprintNFT App Store Submit

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "TestFlight build number to submit"
        required: false
        default: "31"
      price_jpy:
        description: "Japan base customer price in JPY"
        required: false
        default: "100"

concurrency:
  group: voiceprint-appstore-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios/VoiceprintInstallation
    env:
      APP_ID: "6777992670"
      APP_VERSION: "1.0"
      BUILD_NUMBER: ${{ inputs.build_number || '31' }}
      APP_PRICE_JPY: ${{ inputs.price_jpy || '100' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew update
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Build screenshot app
        run: |
          xcodegen generate
          xcodebuild \
            -project VoiceprintInstallation.xcodeproj \
            -scheme VoiceprintInstallation \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture screenshots
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -path '*Debug-iphonesimulator/VoiceprintInstallation.app' -type d | head -1)
          test -n "$APP_PATH"
          . .venv/bin/activate
          python scripts/capture_screenshots.py "$APP_PATH" MarketingAssets/Screenshots

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          chmod 600 "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8

      - name: Submit to App Review
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/submit_production.py
