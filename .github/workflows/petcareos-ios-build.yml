name: PetCareOS iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - "ios/PetCareOS/**"
      - ".github/workflows/petcareos-ios-build.yml"

concurrency:
  group: petcareos-ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/PetCareOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone simulator
        run: |
          xcodebuild build \
            -project PetCareOS.xcodeproj \
            -scheme PetCareOS \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload generated project
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PetCareOS-xcodeproj
          path: ios/PetCareOS/PetCareOS.xcodeproj
