name: KAZU Build and TestFlight

on:
  push:
    branches:
      - agent/kazu-testflight
    paths:
      - "ios/KAZU/**"
      - ".github/workflows/kazu-testflight.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version"
        required: true
        default: "1.0"
      build_number:
        description: "Build number. Blank uses the GitHub run number."
        required: false
        default: ""
      app_id:
        description: "Optional App Store Connect app ID"
        required: false
        default: ""

concurrency:
  group: kazu-testflight
  cancel-in-progress: false

jobs:
  build-test-upload:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/KAZU
    env:
      APP_BUNDLE_ID: com.tokyonasu.kazu
      APP_NAME: "KAZU 専門電卓"
      APP_SKU: kazu-professional-calculator-ios
      APP_ID: ${{ inputs.app_id || '' }}
      BUNDLE_NAME: KAZU
      PROFILE_NAME: "KAZU App Store"
      KAZU_VERSION: ${{ inputs.version || '1.0' }}
      KAZU_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Import distribution certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary-kazu-keychain-password
        shell: bash
        run: |
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > /tmp/kazu-distribution.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" kazu-build.keychain
          security default-keychain -s kazu-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" kazu-build.keychain
          security set-keychain-settings -lut 21600 kazu-build.keychain
          security import /tmp/kazu-distribution.p12 \
            -k kazu-build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            kazu-build.keychain
          CERT_SHA1="$(security find-identity -v -p codesigning kazu-build.keychain | awk 'NR==1 {print $2}')"
          test -n "$CERT_SHA1"
          echo "IOS_DISTRIBUTION_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          . .venv/bin/activate
          export PYTHONPATH="scripts"
          if [ -n "$APP_ID" ]; then
            APP_ID_VALUE="$APP_ID"
          else
            python scripts/ensure_asc_app.py | tee /tmp/kazu-ensure-app.log
            APP_ID_VALUE="$(grep '^APP_ID=' /tmp/kazu-ensure-app.log | tail -1 | cut -d= -f2)"
          fi
          if [ -z "$APP_ID_VALUE" ]; then
            echo "App Store Connect app record could not be resolved."
            exit 1
          fi
          echo "APP_ID=$APP_ID_VALUE" >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          . .venv/bin/activate
          export PYTHONPATH="scripts"
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project KAZU.xcodeproj \
            -scheme KAZU \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d.values() for x in r if x["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project KAZU.xcodeproj \
            -scheme KAZU \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          xcodebuild archive \
            -project KAZU.xcodeproj \
            -scheme KAZU \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/KAZU.xcarchive \
            MARKETING_VERSION="$KAZU_VERSION" \
            CURRENT_PROJECT_VERSION="$KAZU_BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          xcodebuild -exportArchive \
            -archivePath build/KAZU.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        shell: bash
        run: |
          set -o pipefail
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/kazu-upload.log
          if grep -Eqi 'UPLOAD FAILED|Validation failed|STATE_ERROR|ERROR:' /tmp/kazu-upload.log; then
            exit 1
          fi

      - name: Wait for TestFlight processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.KAZU_BUILD_NUMBER }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        shell: bash
        run: |
          . .venv/bin/activate
          export PYTHONPATH="scripts"
          python scripts/wait_for_testflight_build.py

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazu-ipa
          path: ios/KAZU/build/export/*.ipa
          if-no-files-found: ignore
