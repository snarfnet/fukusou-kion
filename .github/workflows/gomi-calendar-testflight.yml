name: GomiCalendar TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version"
        required: true
        default: "1.0"
      build_number:
        description: "Build number. Leave blank to use the GitHub run number."
        required: false
        default: ""
      app_id:
        description: "Optional App Store Connect app ID. Leave blank to resolve or create by bundle ID."
        required: false
        default: ""
      replace_distribution_certificate:
        description: "Delete stale distribution certificates if Apple blocks creating a CI certificate"
        required: false
        default: "false"
  push:
    branches:
      - codex/gomi-calendar-testflight
    paths:
      - ".github/workflows/gomi-calendar-testflight.yml"
      - "ios/GomiCalendar/**"

concurrency:
  group: gomi-calendar-testflight
  cancel-in-progress: true

jobs:
  upload-testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/GomiCalendar
    env:
      APP_BUNDLE_ID: com.tokyonasu.gomicalendar
      APP_NAME: "ごみ日カレンダー"
      APP_SKU: gomi-calendar-ios
      APP_ID: ${{ inputs.app_id || secrets.GOMI_CALENDAR_APP_ID || '' }}
      BUNDLE_NAME: GomiCalendar
      PROFILE_NAME: "GomiCalendar App Store"
      GOMI_CALENDAR_VERSION: ${{ inputs.version || '1.0' }}
      GOMI_CALENDAR_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Create distribution certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
          SIGNING_WORK_DIR: /tmp/gomi-calendar-signing
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          REPLACE_DISTRIBUTION_CERTIFICATE: ${{ inputs.replace_distribution_certificate == 'true' && '1' || '' }}
        shell: bash
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          if [ -n "$IOS_DISTRIBUTION_P12_BASE64" ]; then
            test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
            printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/distribution.p12
            CERT_SHA1=$(openssl pkcs12 -in /tmp/distribution.p12 -nokeys -clcerts -passin pass:"$IOS_DISTRIBUTION_P12_PASSWORD" | openssl x509 -noout -fingerprint -sha1 | sed 's/.*Fingerprint=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')
            security import /tmp/distribution.p12 -k build.keychain -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
            echo "IOS_DISTRIBUTION_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
            rm /tmp/distribution.p12
          else
            . .venv/bin/activate
            python scripts/create_distribution_certificate.py | tee /tmp/gomi-calendar-cert.log
            grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/gomi-calendar-cert.log >> "$GITHUB_ENV"
            grep '^ASC_CERTIFICATE_ID=' /tmp/gomi-calendar-cert.log >> "$GITHUB_ENV"
          fi

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          . .venv/bin/activate
          if [ -n "$APP_ID" ]; then
            APP_ID_VALUE="$APP_ID"
          else
            python scripts/ensure_asc_app.py | tee /tmp/gomi-calendar-ensure-app.log
            APP_ID_VALUE="$(grep '^APP_ID=' /tmp/gomi-calendar-ensure-app.log | tail -1 | cut -d= -f2)"
            if [ -z "$APP_ID_VALUE" ]; then
              echo "App Store Connect app record was not found or created."
              echo "Create app '$APP_NAME' with Bundle ID $APP_BUNDLE_ID and SKU $APP_SKU, then rerun this workflow."
              exit 1
            fi
          fi
          echo "APP_ID=$APP_ID_VALUE" >> "$GITHUB_ENV"
          export APP_ID="$APP_ID_VALUE"
          python scripts/resolve_app_bundle.py | tee /tmp/gomi-calendar-app-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/gomi-calendar-app-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          xcodebuild archive \
            -project GomiCalendar.xcodeproj \
            -scheme GomiCalendar \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/GomiCalendar.xcarchive \
            MARKETING_VERSION="$GOMI_CALENDAR_VERSION" \
            CURRENT_PROJECT_VERSION="$GOMI_CALENDAR_BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/GomiCalendar.xcarchive \
            -exportOptionsPlist export_options.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        shell: bash
        run: |
          set -o pipefail
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apple-id "$APP_ID" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/gomi-calendar-altool-upload.log
          if grep -Eqi 'UPLOAD FAILED|Validation failed|STATE_ERROR|ERROR:' /tmp/gomi-calendar-altool-upload.log; then
            exit 1
          fi

      - name: Wait for TestFlight build processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          APP_ID: ${{ env.APP_ID }}
          BUILD_NUMBER: ${{ env.GOMI_CALENDAR_BUILD_NUMBER }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gomi-calendar-ipa
          path: ios/GomiCalendar/build/export/*.ipa
