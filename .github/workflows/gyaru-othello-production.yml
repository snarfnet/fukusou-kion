name: GyaruOthello App Store Submit

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version"
        required: true
        default: "1.0"
      build_number:
        description: "Build number. Leave blank to use the GitHub run number."
        required: false
        default: ""
  push:
    branches:
      - codex/gyaru-othello-ios-submit
    paths:
      - ".github/workflows/gyaru-othello-production.yml"
      - "ios/GyaruOthello/**"
      - "gyaru-othello.html"
      - "gyaru-othello.css"
      - "gyaru-othello.js"
      - "assets/gyaru-othello/**"

concurrency:
  group: gyaru-othello-production
  cancel-in-progress: true

jobs:
  submit:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/GyaruOthello
    env:
      APP_BUNDLE_ID: com.tokyonasu.gyaruothello
      APP_NAME: "ギャルオセロ"
      APP_SKU: gyaru-othello-ios
      BUNDLE_NAME: GyaruOthello
      PROFILE_NAME: "GyaruOthello App Store"
      APP_VERSION: ${{ inputs.version || '1.0' }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      TARGET_JPY_PRICE: "100"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Create distribution certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-keychain-password' }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        shell: bash
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          if [ -n "$IOS_DISTRIBUTION_P12_BASE64" ]; then
            test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
            printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/distribution.p12
            CERT_SERIAL="$(openssl pkcs12 -in /tmp/distribution.p12 -nokeys -clcerts -passin pass:"$IOS_DISTRIBUTION_P12_PASSWORD" | openssl x509 -noout -serial | sed 's/serial=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            CERT_ENDDATE="$(openssl pkcs12 -in /tmp/distribution.p12 -nokeys -clcerts -passin pass:"$IOS_DISTRIBUTION_P12_PASSWORD" | openssl x509 -noout -enddate | sed 's/notAfter=//')"
            if [ "$CERT_SERIAL" = "797262360B421323CA2A52F022C3F0BF" ] || ! date -j -f "%b %e %T %Y %Z" "$CERT_ENDDATE" "+%s" >/dev/null 2>&1 || [ "$(date -j -f "%b %e %T %Y %Z" "$CERT_ENDDATE" "+%s")" -le "$(date "+%s")" ]; then
              echo "Existing p12 certificate is revoked or expired; creating a fresh CI distribution certificate."
              rm /tmp/distribution.p12
              . .venv/bin/activate
              REPLACE_OLDEST_DISTRIBUTION_CERTIFICATE=1 python scripts/create_distribution_certificate.py | tee /tmp/gyaru-othello-cert.log
              grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/gyaru-othello-cert.log >> "$GITHUB_ENV"
              grep '^ASC_CERTIFICATE_ID=' /tmp/gyaru-othello-cert.log >> "$GITHUB_ENV"
            else
              security import /tmp/distribution.p12 -k build.keychain -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
              security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
              security find-certificate -a -c "Apple Distribution" -Z build.keychain | awk '/SHA-1 hash:/ {print "IOS_DISTRIBUTION_CERT_SHA1="$3; exit}' >> "$GITHUB_ENV"
              rm /tmp/distribution.p12
            fi
          else
            . .venv/bin/activate
            python scripts/create_distribution_certificate.py | tee /tmp/gyaru-othello-cert.log
            grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/gyaru-othello-cert.log >> "$GITHUB_ENV"
          fi

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/ensure_asc_app.py | tee /tmp/gyaru-othello-ensure-app.log
          APP_ID_VALUE="$(grep '^APP_ID=' /tmp/gyaru-othello-ensure-app.log | tail -1 | cut -d= -f2)"
          if [ -z "$APP_ID_VALUE" ]; then
            echo "App Store Connect app record was not found or created."
            exit 1
          fi
          echo "APP_ID=$APP_ID_VALUE" >> "$GITHUB_ENV"
          export APP_ID="$APP_ID_VALUE"
          python scripts/resolve_app_bundle.py | tee /tmp/gyaru-othello-app-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/gyaru-othello-app-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          xcodebuild archive \
            -project GyaruOthello.xcodeproj \
            -scheme GyaruOthello \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/GyaruOthello.xcarchive \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" exportOptions.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" exportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" exportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/GyaruOthello.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify bundled web assets
        shell: bash
        run: |
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          unzip -l "$IPA_PATH" | tee /tmp/gyaru-othello-ipa-files.txt
          grep -q "Payload/GyaruOthello.app/Web/gyaru-othello.html" /tmp/gyaru-othello-ipa-files.txt
          grep -q "Payload/GyaruOthello.app/Web/gyaru-othello.css" /tmp/gyaru-othello-ipa-files.txt
          grep -q "Payload/GyaruOthello.app/Web/gyaru-othello.js" /tmp/gyaru-othello-ipa-files.txt
          grep -q "Payload/GyaruOthello.app/Web/assets/gyaru-othello/" /tmp/gyaru-othello-ipa-files.txt

      - name: Upload build to App Store Connect
        shell: bash
        run: |
          set -o pipefail
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apple-id "$APP_ID" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/gyaru-othello-altool-upload.log
          if grep -Eqi 'UPLOAD FAILED|Validation failed|STATE_ERROR|ERROR:' /tmp/gyaru-othello-altool-upload.log; then
            exit 1
          fi

      - name: Prepare metadata and submit for review
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/submit_production.py

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyaru-othello-ipa
          path: ios/GyaruOthello/build/export/*.ipa
