name: Bible Typewriter iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/BibleTypewriter/**"
      - ".github/workflows/bible-typewriter-ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/BibleTypewriter
        run: xcodegen generate

      - name: Build for iOS simulator
        working-directory: ios/BibleTypewriter
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme BibleTypewriter \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
