name: HeatGuard TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion"
        required: true
        default: "1"

concurrency:
  group: heatguard-testflight
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      APP_BUNDLE_ID: com.heatguard.app
      APP_NAME: 熱中症予防サポート
      APP_SKU: heatguard-app
      PROFILE_NAME: HeatGuard App Store
      APP_SCHEME: App
      APP_PROJECT: heatguard/ios/App/App.xcodeproj

    steps:
      - name: Checkout HeatGuard app branch
        uses: actions/checkout@v4
        with:
          ref: heatguard-app-testflight
          path: heatguard

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: heatguard/package-lock.json

      - name: Install App Store Connect tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Install dependencies
        working-directory: heatguard
        run: npm ci

      - name: Build and sync iOS app
        working-directory: heatguard
        run: npm run ios:sync

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_PRIVATE_KEY"
          test -n "$ASC_KEY_ID"
          mkdir -p /tmp/asc
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install signing certificate
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$IOS_APPSTORE_PROFILE_BASE64"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/distribution.p12
          security import /tmp/distribution.p12 -k build.keychain -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > /tmp/team.mobileprovision
          security cms -D -i /tmp/team.mobileprovision > /tmp/team-profile.plist
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /tmp/team-profile.plist)
          test -n "$TEAM_ID"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Prepare Bundle ID, App Store app, and profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          . .venv/bin/activate
          python <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          from pathlib import Path

          import jwt
          import requests

          API = "https://api.appstoreconnect.apple.com/v1"
          BUNDLE_ID = os.environ["APP_BUNDLE_ID"]
          APP_NAME = os.environ["APP_NAME"]
          APP_SKU = os.environ["APP_SKU"]
          PROFILE_NAME = os.environ["PROFILE_NAME"]
          KEY_ID = os.environ["ASC_KEY_ID"]
          ISSUER_ID = os.environ["ASC_ISSUER_ID"]
          KEY_PATH = Path(f"/tmp/asc/AuthKey_{KEY_ID}.p8")

          def token():
              now = int(time.time())
              payload = {"iss": ISSUER_ID, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
              return jwt.encode(payload, KEY_PATH.read_text(), algorithm="ES256", headers={"kid": KEY_ID, "typ": "JWT"})

          def request(method, path, **kwargs):
              headers = kwargs.pop("headers", {})
              headers["Authorization"] = f"Bearer {token()}"
              headers["Content-Type"] = "application/json"
              response = requests.request(method, f"{API}{path}", headers=headers, timeout=60, **kwargs)
              if response.status_code >= 400:
                  raise RuntimeError(f"{method} {path} failed: {response.status_code} {response.text}")
              return response.json() if response.text else {}

          def query(params):
              return urllib.parse.urlencode(params)

          def ensure_bundle_id():
              body = request("GET", f"/bundleIds?{query({'filter[identifier]': BUNDLE_ID, 'limit': '1'})}")
              if body.get("data"):
                  bundle = body["data"][0]
                  print(f"Bundle ID exists: {BUNDLE_ID} ({bundle['id']})")
                  return bundle
              payload = {
                  "data": {
                      "type": "bundleIds",
                      "attributes": {"identifier": BUNDLE_ID, "name": "HeatGuard", "platform": "IOS"},
                  }
              }
              bundle = request("POST", "/bundleIds", data=json.dumps(payload, ensure_ascii=False))["data"]
              print(f"Bundle ID created: {BUNDLE_ID} ({bundle['id']})")
              return bundle

          def ensure_app(bundle):
              body = request("GET", f"/apps?{query({'filter[bundleId]': BUNDLE_ID, 'limit': '1'})}")
              if body.get("data"):
                  app = body["data"][0]
                  print(f"App Store app exists: {APP_NAME} ({app['id']})")
                  return app
              payload = {
                  "data": {
                      "type": "apps",
                      "attributes": {
                          "name": APP_NAME,
                          "bundleId": BUNDLE_ID,
                          "sku": APP_SKU,
                          "primaryLocale": "ja-JP",
                      },
                      "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bundle["id"]}}},
                  }
              }
              app = request("POST", "/apps", data=json.dumps(payload, ensure_ascii=False))["data"]
              print(f"App Store app created: {APP_NAME} ({app['id']})")
              return app

          def first_distribution_certificate():
              for cert_type in ("IOS_DISTRIBUTION", "DISTRIBUTION"):
                  body = request("GET", f"/certificates?{query({'filter[certificateType]': cert_type, 'limit': '20'})}")
                  if body.get("data"):
                      cert = body["data"][0]
                      print(f"Using certificate: {cert['id']}")
                      return cert
              body = request("GET", "/certificates?limit=20")
              if body.get("data"):
                  cert = body["data"][0]
                  print(f"Using fallback certificate: {cert['id']}")
                  return cert
              raise RuntimeError("No distribution certificate found in App Store Connect.")

          def profile_certificate_ids(profile_id):
              body = request("GET", f"/profiles/{profile_id}/relationships/certificates?limit=10")
              return {item["id"] for item in body.get("data", [])}

          def ensure_profile(bundle, certificate):
              body = request("GET", f"/profiles?{query({'filter[name]': PROFILE_NAME, 'limit': '20'})}")
              for profile in body.get("data", []):
                  attrs = profile.get("attributes", {})
                  if attrs.get("profileState") == "ACTIVE" and certificate["id"] in profile_certificate_ids(profile["id"]):
                      detail = request("GET", f"/profiles/{profile['id']}")["data"]
                      if detail.get("attributes", {}).get("profileContent"):
                          print(f"Profile exists: {PROFILE_NAME} ({profile['id']})")
                          return detail
              payload = {
                  "data": {
                      "type": "profiles",
                      "attributes": {"name": PROFILE_NAME, "profileType": "IOS_APP_STORE"},
                      "relationships": {
                          "bundleId": {"data": {"type": "bundleIds", "id": bundle["id"]}},
                          "certificates": {"data": [{"type": "certificates", "id": certificate["id"]}]},
                      },
                  }
              }
              profile = request("POST", "/profiles", data=json.dumps(payload, ensure_ascii=False))["data"]
              detail = request("GET", f"/profiles/{profile['id']}")["data"]
              print(f"Profile created: {PROFILE_NAME} ({profile['id']})")
              return detail

          bundle = ensure_bundle_id()
          ensure_app(bundle)
          certificate = first_distribution_certificate()
          profile = ensure_profile(bundle, certificate)
          content = profile.get("attributes", {}).get("profileContent")
          if not content:
              raise RuntimeError("Profile exists, but profileContent is empty.")

          profile_dir = Path.home() / "Library/MobileDevice/Provisioning Profiles"
          profile_dir.mkdir(parents=True, exist_ok=True)
          profile_path = profile_dir / "HeatGuard_App_Store.mobileprovision"
          profile_path.write_bytes(base64.b64decode(content))
          print(f"Installed profile: {profile_path}")
          PY

      - name: Set build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.event.inputs.build_number }}" heatguard/ios/App/App/Info.plist

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          xcodebuild archive \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HeatGuard.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HeatGuard.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heatguard-ios-export
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
