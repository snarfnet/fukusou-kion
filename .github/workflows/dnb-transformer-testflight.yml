name: CHOP 170 TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      register_only:
        description: "Create or resolve the App Store Connect app without uploading a build"
        required: false
        default: "false"
  push:
    branches:
      - codex/dnb-transformer-testflight
    paths:
      - ".github/workflows/dnb-transformer-testflight.yml"
      - "ios/DNBTransformer/**"

concurrency:
  group: dnb-transformer-testflight
  cancel-in-progress: true

jobs:
  upload-testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/DNBTransformer
    env:
      APP_BUNDLE_ID: com.tokyonasu.chop170
      APP_NAME: "CHOP 170 - DnB Generator"
      APP_SKU: chop-170-ios
      BUNDLE_NAME: DNBTransformer
      PROFILE_NAME: "CHOP170 App Store"
      SAVED_APP_ID: ${{ secrets.DNB_TRANSFORMER_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_PRIVATE_KEY"
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          if [ -n "$SAVED_APP_ID" ]; then
            echo "APP_ID=$SAVED_APP_ID" >> "$GITHUB_ENV"
          else
            python scripts/ensure_asc_app.py | tee /tmp/dnb-app.log
            grep '^APP_ID=' /tmp/dnb-app.log >> "$GITHUB_ENV"
          fi

      - name: Stop after registration
        if: ${{ github.event.inputs.register_only == 'true' }}
        run: echo "App Store Connect app is ready."

      - name: Install distribution certificate
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          KEYCHAIN_PASSWORD: temporary-keychain-password
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/distribution.p12
          CERT_SHA1=$(openssl pkcs12 -in /tmp/distribution.p12 -nokeys -clcerts -passin pass:"$IOS_DISTRIBUTION_P12_PASSWORD" | openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          security import /tmp/distribution.p12 -k build.keychain -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "IOS_DISTRIBUTION_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
          rm /tmp/distribution.p12

      - name: Prepare provisioning profile
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        if: ${{ github.event.inputs.register_only != 'true' }}
        run: xcodegen generate

      - name: Archive
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUM: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -project DNBTransformer.xcodeproj \
            -scheme DNBTransformer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DNBTransformer.xcarchive \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

      - name: Export and upload IPA
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild -exportArchive \
            -archivePath build/DNBTransformer.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Wait for TestFlight processing
        if: ${{ github.event.inputs.register_only != 'true' }}
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ github.run_number }}
          WAIT_SECONDS: "2400"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Upload archive artifact
        if: always() && github.event.inputs.register_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DNBTransformer-xcarchive
          path: ios/DNBTransformer/build/DNBTransformer.xcarchive
          if-no-files-found: ignore
