name: OAHSPE Alpha78 Submit

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "TestFlight build number to submit"
        required: true
        default: "18"
      app_version:
        description: "App Store version"
        required: true
        default: "1.0"
      prepare_only:
        description: "Update metadata and price, but do not submit"
        required: false
        default: "false"

jobs:
  submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios/NoAdsCamera
    env:
      PRICE_JPY: "1200"
      PRIVACY_URL: "https://snarfnet.github.io/privacy.html"
      MASTERSHOT_CAMERA_APP_ID: ${{ secrets.MASTERSHOT_CAMERA_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          chmod 600 /tmp/asc_key.p8
          if [ -n "$MASTERSHOT_CAMERA_APP_ID" ]; then
            echo "APP_ID=$MASTERSHOT_CAMERA_APP_ID" >> "$GITHUB_ENV"
          else
            echo "APP_ID=6779207312" >> "$GITHUB_ENV"
          fi

      - name: Submit App Store version
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_VERSION: ${{ inputs.app_version }}
          PREPARE_ONLY: ${{ inputs.prepare_only == 'true' && '1' || '0' }}
        run: python3 scripts/submit_production.py
