name: Lost in Japan Production Submission

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: TestFlight build number
        required: true
        default: "108"
  push:
    branches:
      - "codex/lost-in-japan-testflight"
    paths:
      - ".github/workflows/lost-in-japan-production.yml"

concurrency:
  group: lost-in-japan-production
  cancel-in-progress: false

jobs:
  submit-production:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/LostInJapan
    env:
      APP_BUNDLE_ID: com.tokyonasu.lostinjapan
      APP_VERSION: "1.0"
      BUILD_NUMBER: ${{ inputs.build_number || '108' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode and install tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Build screenshot app
        run: |
          xcodegen generate
          xcodebuild build \
            -project LostInJapan.xcodeproj \
            -scheme LostInJapan \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID"

      - name: Capture App Store screenshots
        run: |
          APP_PATH="$(find build/simulator/Build/Products -path '*Debug-iphonesimulator/Lost in Japan.app' -print -quit)"
          test -n "$APP_PATH"
          python3 Scripts/capture_store_screenshots.py "$APP_PATH" MarketingAssets/Screenshots
          find MarketingAssets/Screenshots -name '*.png' -print

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: lost-in-japan-app-store-screenshots
          path: ios/LostInJapan/MarketingAssets/Screenshots/**/*.png

      - name: Prepare App Store Connect credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_PRIVATE_KEY"
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          printf '%s' "$ASC_PRIVATE_KEY" > /tmp/asc_key.p8
          chmod 600 /tmp/asc_key.p8

      - name: Configure USD 2.00 and submit for review
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python Scripts/submit_production.py
