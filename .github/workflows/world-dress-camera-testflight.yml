name: WorldDressCamera TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      replace_distribution_certificate:
        description: "Delete existing distribution certificates if Apple blocks creating a CI certificate"
        required: false
        default: "false"
  push:
    branches:
      - codex/world-dress-camera-build
    paths:
      - ".github/workflows/world-dress-camera-testflight.yml"
      - "ios/WorldDressCamera/WorldDressCamera/**"
      - "ios/WorldDressCamera/scripts/create_distribution_certificate.py"

concurrency:
  group: world-dress-camera-testflight
  cancel-in-progress: false

jobs:
  upload-testflight:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ios/WorldDressCamera
    env:
      APP_BUNDLE_ID: com.tokyonasu.worlddresscamera
      APP_NAME: "民族衣装カメラ"
      APP_SKU: world-dress-camera-ios
      BUNDLE_NAME: WorldDressCamera
      PROFILE_NAME: "WorldDressCamera App Store"
      DEVELOPMENT_TEAM: 83VGKGSQUH
      APP_VERSION: "1.0"
      WORLD_DRESS_CAMERA_APP_ID: ${{ secrets.WORLD_DRESS_CAMERA_APP_ID || '6794936502' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Install distribution certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
          REPLACE_DISTRIBUTION_CERTIFICATE: ${{ github.event.inputs.replace_distribution_certificate }}
          STALE_CERTIFICATE_ID: G5N7Q6PGNQ
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          . .venv/bin/activate
          python scripts/create_distribution_certificate.py | tee /tmp/world-dress-camera-cert.log
          grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/world-dress-camera-cert.log >> "$GITHUB_ENV"
          grep '^ASC_CERTIFICATE_ID=' /tmp/world-dress-camera-cert.log >> "$GITHUB_ENV"

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          if [ -n "$WORLD_DRESS_CAMERA_APP_ID" ]; then
            echo "APP_ID=$WORLD_DRESS_CAMERA_APP_ID" >> "$GITHUB_ENV"
          else
            python scripts/ensure_asc_app.py | tee /tmp/world-dress-camera-app.log
            grep '^APP_ID=' /tmp/world-dress-camera-app.log >> "$GITHUB_ENV"
          fi

      - name: Resolve app bundle
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/resolve_app_bundle.py | tee /tmp/world-dress-camera-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/world-dress-camera-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Set build number
        run: |
          BUILD_NUM=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project WorldDressCamera.xcodeproj \
            -scheme WorldDressCamera \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/WorldDressCamera.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

      - name: Export and upload
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/WorldDressCamera.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Wait for TestFlight processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.BUILD_NUM }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorldDressCamera-xcarchive
          path: ios/WorldDressCamera/build/WorldDressCamera.xcarchive
          if-no-files-found: ignore
