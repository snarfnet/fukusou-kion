name: MorimoriPhotoMaker iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/morimori-photo-maker-ios
    paths:
      - ".github/workflows/morimori-photo-maker-ios-build.yml"
      - "ios/MorimoriPhotoMaker/**"

concurrency:
  group: morimori-photo-maker-ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/MorimoriPhotoMaker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator
        run: |
          xcodebuild build \
            -project MorimoriPhotoMaker.xcodeproj \
            -scheme MorimoriPhotoMaker \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            CODE_SIGNING_ALLOWED=NO
