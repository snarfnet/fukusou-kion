name: ShokuninSumahoDX iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sermon-notes-github-build
      - codex/shokunin-sumaho-dx
    paths:
      - ".github/workflows/shokunin-sumaho-dx-ios-build.yml"
      - "ios/ShokuninSumahoDX/**"

concurrency:
  group: shokunin-sumaho-dx-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/ShokuninSumahoDX

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project ShokuninSumahoDX.xcodeproj \
            -scheme ShokuninSumahoDX \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run compact iPhone UI check
        run: |
          DEVICE_ID=$(
            xcrun simctl list devices available |
              grep -E "^[[:space:]]+iPhone SE.*\\([0-9A-F-]{36}\\)" |
              sed -E 's/.*\\(([0-9A-F-]{36})\\).*/\1/' |
              head -n 1
          )
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(
              xcrun simctl list devices available |
                grep -E "^[[:space:]]+iPhone (16e|17e).*\\([0-9A-F-]{36}\\)" |
                sed -E 's/.*\\(([0-9A-F-]{36})\\).*/\1/' |
                head -n 1
            )
          fi
          if [ -z "$DEVICE_ID" ]; then
            echo "No compact iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test \
            -project ShokuninSumahoDX.xcodeproj \
            -scheme ShokuninSumahoDX \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/CompactDerivedData \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/screenshots
          xcrun simctl io "$DEVICE_ID" screenshot build/screenshots/compact-iphone.png
          xcrun simctl shutdown "$DEVICE_ID" || true

      - name: Run iPad UI check
        run: |
          DEVICE_ID=$(
            xcrun simctl list devices available |
              grep -E "^[[:space:]]+iPad.*\\([0-9A-F-]{36}\\)" |
              sed -E 's/.*\\(([0-9A-F-]{36})\\).*/\1/' |
              head -n 1
          )
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPad simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test \
            -project ShokuninSumahoDX.xcodeproj \
            -scheme ShokuninSumahoDX \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/IPadDerivedData \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/screenshots
          xcrun simctl io "$DEVICE_ID" screenshot build/screenshots/ipad.png
          xcrun simctl shutdown "$DEVICE_ID" || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ShokuninSumahoDX-screenshots
          path: ios/ShokuninSumahoDX/build/screenshots/*.png
          if-no-files-found: error
