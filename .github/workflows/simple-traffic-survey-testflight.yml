name: SimpleTrafficSurvey TestFlight

on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: "Optional App Store Connect build number"
        required: false
        default: ""

concurrency:
  group: simple-traffic-survey-testflight
  cancel-in-progress: true

jobs:
  upload-testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/SimpleTrafficSurvey
    env:
      APP_BUNDLE_ID: com.tokyonasu.simpletrafficsurvey
      BUNDLE_NAME: SimpleTrafficSurvey
      PROFILE_NAME: "SimpleTrafficSurvey App Store"
      APP_VERSION: "1.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages --upgrade PyJWT cryptography requests

      - name: Set build number
        run: |
          if [ -n "${{ inputs.buildNumber }}" ]; then
            BUILD_NUMBER="${{ inputs.buildNumber }}"
          else
            BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 200))
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          sed -i "" "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          echo "Using build number $BUILD_NUMBER"

      - name: Write App Store Connect key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p ~/.appstoreconnect/private_keys /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          chmod 600 "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Create keychain and install certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-keychain-password' }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          set +e
          python3 scripts/create_distribution_certificate.py > /tmp/simple-traffic-survey-cert.log 2>&1
          CERT_CREATE_STATUS=$?
          set -e
          cat /tmp/simple-traffic-survey-cert.log
          if [ "$CERT_CREATE_STATUS" -eq 0 ] && grep -q '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/simple-traffic-survey-cert.log; then
            grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/simple-traffic-survey-cert.log >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Fresh certificate creation failed; falling back to stored certificate secret."
          if [ -n "$CERT_BASE64" ]; then
            printf '%s' "$CERT_BASE64" | base64 --decode > /tmp/distribution.p12
            security import /tmp/distribution.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          elif [ -n "$IOS_DISTRIBUTION_P12_BASE64" ]; then
            printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/distribution.p12
            security import /tmp/distribution.p12 -k build.keychain -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          else
            echo "No usable distribution certificate source."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-certificate -a -c "Apple Distribution" -Z build.keychain | awk '/SHA-1 hash:/ {print "IOS_DISTRIBUTION_CERT_SHA1="$3; exit}' >> "$GITHUB_ENV"

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: |
          if [ -n "${{ secrets.SIMPLE_TRAFFIC_SURVEY_APP_ID }}" ]; then
            echo "APP_ID=${{ secrets.SIMPLE_TRAFFIC_SURVEY_APP_ID }}" >> "$GITHUB_ENV"
          else
            python3 scripts/ensure_asc_app.py | tee /tmp/simple-traffic-survey-ensure-app.log
            APP_ID_VALUE="$(grep '^APP_ID=' /tmp/simple-traffic-survey-ensure-app.log | tail -1 | cut -d= -f2)"
            test -n "$APP_ID_VALUE"
            echo "APP_ID=$APP_ID_VALUE" >> "$GITHUB_ENV"
          fi

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: python3 scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project SimpleTrafficSurvey.xcodeproj \
            -scheme SimpleTrafficSurvey \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SimpleTrafficSurvey.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/SimpleTrafficSurvey.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload build to App Store Connect
        run: |
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
