name: SermonNotes Submit Production

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Uploaded App Store Connect build number"
        required: true
        default: "5"
      app_id:
        description: "App Store Connect app ID"
        required: true
        default: "6777022273"
      price_jpy:
        description: "Japan customer price in JPY"
        required: true
        default: "100"

concurrency:
  group: sermon-notes-submit-production
  cancel-in-progress: true

jobs:
  submit-production:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/SermonNotes
    env:
      APP_ID: ${{ inputs.app_id }}
      APP_VERSION: "1.0"
      BUILD_NUMBER: ${{ inputs.build_number }}
      APP_PRICE_JPY: ${{ inputs.price_jpy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          chmod 600 "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8

      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages --upgrade pyjwt cryptography requests

      - name: Submit for App Review
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: python3 scripts/submit_production.py
