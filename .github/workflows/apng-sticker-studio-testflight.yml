name: Anime Stamp APNG Sticker Studio TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches:
      - codex/apng-sticker-studio-testflight
    paths:
      - ".github/workflows/apng-sticker-studio-testflight.yml"
      - "ios/APNGStickerStudio/**"

concurrency:
  group: apng-sticker-studio-testflight
  cancel-in-progress: true

jobs:
  upload-testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/APNGStickerStudio
    env:
      APP_BUNDLE_ID: com.tokyonasu.apngstickerstudio
      APP_NAME: "アニメスタンプ作成 APNG Sticker Studio"
      APP_SKU: apng-sticker-studio-ios
      BUNDLE_NAME: APNGStickerStudio
      PROFILE_NAME: "APNGStickerStudio App Store"
      APNG_STICKER_STUDIO_APP_ID: ${{ secrets.APNG_STICKER_STUDIO_APP_ID }}
      APNG_STICKER_STUDIO_FALLBACK_APP_ID: "6780890072"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: |
          . .venv/bin/activate
          if [ -n "$APNG_STICKER_STUDIO_APP_ID" ]; then
            echo "APP_ID=$APNG_STICKER_STUDIO_APP_ID" >> "$GITHUB_ENV"
            python scripts/ensure_asc_app.py
          elif [ -n "$APNG_STICKER_STUDIO_FALLBACK_APP_ID" ]; then
            echo "APP_ID=$APNG_STICKER_STUDIO_FALLBACK_APP_ID" >> "$GITHUB_ENV"
            python scripts/ensure_asc_app.py
          else
            python scripts/ensure_asc_app.py | tee /tmp/apng-sticker-studio-app.log
            if grep '^APP_ID=' /tmp/apng-sticker-studio-app.log >> "$GITHUB_ENV"; then
              echo "App Store Connect app resolved."
            else
              echo "App Store Connect app is not ready yet."
              echo "Create an app record for $APP_BUNDLE_ID, then add GitHub Secret APNG_STICKER_STUDIO_APP_ID."
              exit 1
            fi
          fi

      - name: Resolve app bundle
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/resolve_app_bundle.py | tee /tmp/apng-sticker-studio-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/apng-sticker-studio-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build number
        run: |
          BUILD_NUM=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project APNGStickerStudio.xcodeproj \
            -scheme APNGStickerStudio \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/APNGStickerStudio.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

      - name: Export and upload IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild -exportArchive \
            -archivePath build/APNGStickerStudio.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Wait for TestFlight build processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.BUILD_NUM }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APNGStickerStudio-ipa
          path: ios/APNGStickerStudio/build/export/*.ipa
