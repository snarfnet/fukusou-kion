name: Anime Stamp APNG Sticker Studio TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      replace_distribution_certificate:
        description: "Delete the oldest active distribution certificate if Apple blocks creating a CI certificate"
        required: false
        default: "false"
  push:
    branches:
      - codex/apng-sticker-studio-testflight
    paths:
      - ".github/workflows/apng-sticker-studio-testflight.yml"
      - "ios/APNGStickerStudio/**"

concurrency:
  group: apng-sticker-studio-testflight
  cancel-in-progress: true

jobs:
  upload-testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/APNGStickerStudio
    env:
      APP_BUNDLE_ID: com.tokyonasu.apngstickerstudio
      APP_NAME: "アニメスタンプ作成 APNG Sticker Studio"
      APP_SKU: apng-sticker-studio-ios
      BUNDLE_NAME: APNGStickerStudio
      PROFILE_NAME: "APNGStickerStudio App Store"
      APNG_STICKER_STUDIO_APP_ID: ${{ secrets.APNG_STICKER_STUDIO_APP_ID }}
      APNG_STICKER_STUDIO_FALLBACK_APP_ID: "6780890072"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Install distribution certificate
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_KEYCHAIN: build.keychain
          KEYCHAIN_PASSWORD: temporary-keychain-password
          APNG_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.APNG_IOS_DISTRIBUTION_P12_BASE64 }}
          APNG_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APNG_IOS_DISTRIBUTION_P12_PASSWORD }}
          REPLACE_OLDEST_DISTRIBUTION_CERTIFICATE: ${{ github.event.inputs.replace_distribution_certificate }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/AppleWWDRCAG3.cer
          security import /tmp/AppleWWDRCAG3.cer -k build.keychain -T /usr/bin/codesign || true
          if [ -n "$APNG_IOS_DISTRIBUTION_P12_BASE64" ]; then
            test -n "$APNG_IOS_DISTRIBUTION_P12_PASSWORD"
            printf '%s' "$APNG_IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/apng-distribution.p12
            security import /tmp/apng-distribution.p12 -k build.keychain -P "$APNG_IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
            CERT_SHA1=$(security find-identity -v -p codesigning build.keychain | awk '/Apple Distribution|iPhone Distribution|Apple Development/{print $2; exit}')
            echo "IOS_DISTRIBUTION_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
            rm /tmp/apng-distribution.p12
          else
            . .venv/bin/activate
            python scripts/create_distribution_certificate.py | tee /tmp/apng-sticker-studio-cert.log
            grep '^IOS_DISTRIBUTION_CERT_SHA1=' /tmp/apng-sticker-studio-cert.log >> "$GITHUB_ENV"
            grep '^ASC_CERTIFICATE_ID=' /tmp/apng-sticker-studio-cert.log >> "$GITHUB_ENV"
          fi

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: |
          . .venv/bin/activate
          if [ -n "$APNG_STICKER_STUDIO_APP_ID" ]; then
            echo "APP_ID=$APNG_STICKER_STUDIO_APP_ID" >> "$GITHUB_ENV"
            python scripts/ensure_asc_app.py
          elif [ -n "$APNG_STICKER_STUDIO_FALLBACK_APP_ID" ]; then
            echo "APP_ID=$APNG_STICKER_STUDIO_FALLBACK_APP_ID" >> "$GITHUB_ENV"
            python scripts/ensure_asc_app.py
          else
            python scripts/ensure_asc_app.py | tee /tmp/apng-sticker-studio-app.log
            if grep '^APP_ID=' /tmp/apng-sticker-studio-app.log >> "$GITHUB_ENV"; then
              echo "App Store Connect app resolved."
            else
              echo "App Store Connect app is not ready yet."
              echo "Create an app record for $APP_BUNDLE_ID, then add GitHub Secret APNG_STICKER_STUDIO_APP_ID."
              exit 1
            fi
          fi

      - name: Resolve app bundle
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/resolve_app_bundle.py | tee /tmp/apng-sticker-studio-bundle.log
          grep '^APP_BUNDLE_ID=' /tmp/apng-sticker-studio-bundle.log >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/prepare_profile.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build number
        run: |
          BUILD_NUM=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project APNGStickerStudio.xcodeproj \
            -scheme APNGStickerStudio \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/APNGStickerStudio.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" export_options.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" export_options.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/APNGStickerStudio.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Inspect IPA signature
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          echo "IPA: $IPA"
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          unzip -q "$IPA" -d /tmp/ipacheck
          APP=$(ls -d /tmp/ipacheck/Payload/*.app | head -1)
          echo "=== codesign authority ==="
          codesign -dvvv "$APP" 2>&1 | grep -iE "Authority|TeamIdentifier|Identifier=" || true
          echo "=== embedded profile ==="
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null > /tmp/prof.plist || true
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/prof.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" /tmp/prof.plist 2>/dev/null || echo "(no ProvisionsAllDevices key)"
          echo "--- profile cert SHA1 ---"
          /usr/libexec/PlistBuddy -c "Print :DeveloperCertificates:0" /tmp/prof.plist 2>/dev/null | tr -d ' \n' | sed 's/.*<data>//;s/<\/data>.*//' | base64 --decode 2>/dev/null | openssl x509 -inform DER -noout -fingerprint -sha1 -subject 2>&1 || true

      - name: Upload IPA via altool
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Wait for TestFlight build processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ env.BUILD_NUM }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
        run: |
          . .venv/bin/activate
          python scripts/wait_for_testflight_build.py

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APNGStickerStudio-ipa
          path: ios/APNGStickerStudio/build/export/*.ipa
