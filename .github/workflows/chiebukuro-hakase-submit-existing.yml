name: ChiebukuroHakase Submit Existing Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.0"
        required: true
        default: "1.0"
      build_number:
        description: "Existing processed build number to submit"
        required: true
        default: "6"
  push:
    branches:
      - codex/chiebukuro-hakase-deluxe
    paths:
      - ".github/workflows/chiebukuro-hakase-submit-existing.yml"

jobs:
  submit-existing:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/ChiebukuroHakase
    env:
      APP_BUNDLE_ID: com.tokyonasu.chiebukurohakase
      APP_VERSION: ${{ inputs.version || '1.0' }}
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          else
            test -n "$ASC_API_KEY_CONTENT"
            printf '%s' "$ASC_API_KEY_CONTENT" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          fi
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          chmod 600 /tmp/asc_key.p8

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Resolve App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/resolve_app_by_bundle.py | tee /tmp/chiebukuro-hakase-app.log
          grep '^APP_ID=' /tmp/chiebukuro-hakase-app.log >> "$GITHUB_ENV"

      - name: Upload App Store metadata and screenshots
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/upload_appstore_assets.py

      - name: Submit for App Review
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/submit_for_review.py
