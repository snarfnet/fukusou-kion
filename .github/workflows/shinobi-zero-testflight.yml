name: SHINOBI ZERO TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version
        required: true
        default: "0.1.0"
  push:
    branches:
      - "codex/shinobi-zero-testflight"
    paths:
      - "shinobi-zero-unity/**"
      - ".github/workflows/shinobi-zero-testflight.yml"

concurrency:
  group: shinobi-zero-testflight
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Unity EditMode tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify Unity license
        env:
          UNITY_LICENSE_VALUE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL_VALUE: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL_VALUE: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_VALUE: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_EMAIL_VALUE" || { echo "Missing GitHub Secret: UNITY_EMAIL"; exit 1; }
          test -n "$UNITY_PASSWORD_VALUE" || { echo "Missing GitHub Secret: UNITY_PASSWORD"; exit 1; }
          test -n "$UNITY_LICENSE_VALUE" || test -n "$UNITY_SERIAL_VALUE" || { echo "Add UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro)"; exit 1; }

      - name: Validate source
        run: |
          node shinobi-zero-unity/Tools/validate-project.js
          python3 shinobi-zero-unity/Tools/validate-font-coverage.py

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: shinobi-zero-unity/Library
          key: Library-EditMode-${{ hashFiles('shinobi-zero-unity/Assets/**', 'shinobi-zero-unity/Packages/**', 'shinobi-zero-unity/ProjectSettings/**') }}
          restore-keys: Library-EditMode-

      - name: Run Unity EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: shinobi-zero-unity
          unityVersion: 6000.3.0f1
          testMode: EditMode
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: SHINOBI ZERO iOS EditMode Tests

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-zero-ios-test-results-${{ github.run_number }}
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 14

  upload-testflight:
    needs: test
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APP_BUNDLE_ID: com.shinobizero.game
      APP_NAME: SHINOBI ZERO
      APP_SKU: shinobi-zero-ios
      BUNDLE_NAME: ShinobiZero
      PROFILE_NAME: SHINOBI ZERO App Store
      DEVELOPMENT_TEAM: 83VGKGSQUH
      APP_VERSION: ${{ inputs.version || '0.1.0' }}
      UNITY_PROJECT: shinobi-zero-unity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          UNITY_LICENSE_VALUE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL_VALUE: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL_VALUE: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_VALUE: ${{ secrets.UNITY_PASSWORD }}
          ASC_PRIVATE_KEY_VALUE: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID_VALUE: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_VALUE: ${{ secrets.ASC_ISSUER_ID }}
          DISTRIBUTION_P12_VALUE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_PASSWORD_VALUE: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          test -n "$UNITY_EMAIL_VALUE" || { echo "Missing GitHub Secret: UNITY_EMAIL"; exit 1; }
          test -n "$UNITY_PASSWORD_VALUE" || { echo "Missing GitHub Secret: UNITY_PASSWORD"; exit 1; }
          test -n "$UNITY_LICENSE_VALUE" || test -n "$UNITY_SERIAL_VALUE" || { echo "Add UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro)"; exit 1; }
          test -n "$ASC_PRIVATE_KEY_VALUE"
          test -n "$ASC_KEY_ID_VALUE"
          test -n "$ASC_ISSUER_ID_VALUE"
          test -n "$DISTRIBUTION_P12_VALUE"
          test -n "$DISTRIBUTION_PASSWORD_VALUE"

      - name: Validate source and privacy manifest
        run: |
          node shinobi-zero-unity/Tools/validate-project.js
          python3 shinobi-zero-unity/Tools/validate-privacy-manifest.py
          python3 shinobi-zero-unity/Tools/validate-font-coverage.py

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: shinobi-zero-unity/Library
          key: shinobi-zero-unity-6000.3.0f1-ios-${{ hashFiles('shinobi-zero-unity/Assets/**', 'shinobi-zero-unity/Packages/**', 'shinobi-zero-unity/ProjectSettings/**') }}
          restore-keys: |
            shinobi-zero-unity-6000.3.0f1-ios-

      - name: Build Unity Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: shinobi-zero-unity
          unityVersion: 6000.3.0f1
          targetPlatform: iOS
          buildMethod: ShinobiZero.Editor.CiBuild.BuildIos
          customParameters: -szVersion ${{ env.APP_VERSION }} -szBuildNumber ${{ github.run_number }}
          cacheUnityInstallationOnMac: true
          allowDirtyBuild: true

      - name: Verify generated Xcode project
        run: |
          test -f shinobi-zero-unity/Builds/iOS/Unity-iPhone.xcodeproj/project.pbxproj
          test -f shinobi-zero-unity/Builds/iOS/PrivacyInfo.xcprivacy
          test -f shinobi-zero-unity/Builds/iOS/build-manifest.json
          xcodebuild -version

      - name: Install App Store Connect tools
        run: |
          python3 -m venv /tmp/shinobi-asc-venv
          . /tmp/shinobi-asc-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Import distribution certificate
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: shinobi-zero-temporary-keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > /tmp/distribution.p12
          security import /tmp/distribution.p12 -k build.keychain -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_SHA1=$(openssl pkcs12 -in /tmp/distribution.p12 -nokeys -clcerts -passin pass:"$IOS_DISTRIBUTION_P12_PASSWORD" | openssl x509 -noout -fingerprint -sha1 | sed -E 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "IOS_DISTRIBUTION_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
          rm /tmp/distribution.p12

      - name: Ensure App Store app and provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          PYTHONPATH: ios/DailyAngel/scripts
        run: |
          . /tmp/shinobi-asc-venv/bin/activate
          python ios/DailyAngel/scripts/ensure_asc_app.py | tee /tmp/shinobi-app.log
          grep '^APP_ID=' /tmp/shinobi-app.log | tail -1 >> "$GITHUB_ENV"
          python ios/DailyAngel/scripts/prepare_profile.py

      - name: Archive signed app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project shinobi-zero-unity/Builds/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath shinobi-zero-unity/Builds/SHINOBI_ZERO.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          cat > /tmp/shinobi-export-options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>${APP_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath shinobi-zero-unity/Builds/SHINOBI_ZERO.xcarchive \
            -exportPath shinobi-zero-unity/Builds/export \
            -exportOptionsPlist /tmp/shinobi-export-options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          IPA_PATH=$(find shinobi-zero-unity/Builds/export -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/shinobi-upload.log
          grep -q "UPLOAD SUCCEEDED" /tmp/shinobi-upload.log

      - name: Wait for TestFlight processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          BUILD_NUMBER: ${{ github.run_number }}
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "30"
          PYTHONPATH: ios/ChiebukuroNagare/scripts
        run: |
          . /tmp/shinobi-asc-venv/bin/activate
          python ios/ChiebukuroNagare/scripts/wait_for_testflight_build.py

      - name: Upload IPA and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-zero-ios-${{ github.run_number }}
          path: |
            shinobi-zero-unity/Builds/export/*.ipa
            shinobi-zero-unity/Builds/iOS/build-manifest.json
          if-no-files-found: ignore
