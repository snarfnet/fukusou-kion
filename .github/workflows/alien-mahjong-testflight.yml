name: Alien Mahjong TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version
        required: false
        default: "1.0.0"
      build_number:
        description: Build number (blank uses GitHub run number)
        required: false
        default: ""
  push:
    branches:
      - agent/alien-mahjong-testflight
    paths:
      - ".github/workflows/alien-mahjong-testflight.yml"
      - "ios/AlienMahjong/**"

concurrency:
  group: alien-mahjong-testflight
  cancel-in-progress: false

jobs:
  test-build-upload:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ios/AlienMahjong
    env:
      APP_BUNDLE_ID: com.tokyonasu.moonshotmahjong
      APP_NAME: "Moonshot Mahjong: Last Earth"
      APP_SKU: moonshot-mahjong-ios
      BUNDLE_NAME: AlienMahjong
      PROFILE_NAME: "Moonshot Mahjong App Store"
      APP_VERSION: ${{ inputs.version || '1.0.0' }}
      BUILD_NUM: ${{ inputs.build_number || github.run_number }}
      DEVELOPMENT_TEAM: 83VGKGSQUH

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography requests

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID_SECRET: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_PRIVATE_KEY"
          test -n "$ASC_KEY_ID_SECRET"
          test -n "$ASC_ISSUER_ID_SECRET"
          echo "ASC_KEY_ID=$ASC_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          mkdir -p /tmp/asc "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" /tmp/asc_key.p8
          cp "/tmp/asc/AuthKey_${ASC_KEY_ID_SECRET}.p8" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"
          chmod 600 /tmp/asc_key.p8 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_SECRET}.p8"

      - name: Create and install distribution certificate
        env:
          KEYCHAIN_PASSWORD: temporary-keychain-password
          ASC_P8_PATH: /tmp/asc_key.p8
          CERTIFICATE_CSR_PATH: /tmp/distribution.csr
          CERTIFICATE_OUTPUT_PATH: /tmp/distribution.cer
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          openssl genrsa -out /tmp/distribution.key 2048
          openssl req -new -key /tmp/distribution.key \
            -out "$CERTIFICATE_CSR_PATH" \
            -subj "/CN=Moonshot Mahjong CI/O=83VGKGSQUH/C=JP"
          . .venv/bin/activate
          python scripts/create_distribution_certificate.py |
            tee /tmp/alien-certificate.log
          grep '^CERTIFICATE_ID=' /tmp/alien-certificate.log >> "$GITHUB_ENV"
          security import /tmp/distribution.key \
            -k build.keychain \
            -T /usr/bin/codesign -T /usr/bin/security
          security import "$CERTIFICATE_OUTPUT_PATH" \
            -k build.keychain \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Ensure App Store Connect app
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/ensure_asc_app.py | tee /tmp/alien-app.log
          grep '^APP_ID=' /tmp/alien-app.log >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install App Store provisioning profile
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
          PROFILE_OUTPUT_PATH: /tmp/AlienMahjong.mobileprovision
        run: |
          . .venv/bin/activate
          python scripts/install_provisioning_profile.py
          PROFILE_PLIST=/tmp/AlienMahjong-profile.plist
          security cms -D -i "$PROFILE_OUTPUT_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_OUTPUT_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Run iOS unit tests
        run: |
          DEVICE_ID="$(
            xcrun simctl list devices available -j |
            python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for devices in data.values() for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))'
          )"
          xcodebuild test \
            -project AlienMahjong.xcodeproj \
            -scheme AlienMahjong \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AlienMahjongTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild archive \
            -project AlienMahjong.xcodeproj \
            -scheme AlienMahjong \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AlienMahjong.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

      - name: Verify archive
        run: |
          APP_PATH="build/AlienMahjong.xcarchive/Products/Applications/AlienMahjong.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test -f "$APP_PATH/AppIcon60x60@2x.png"
          test "$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          )" = "$APP_BUNDLE_ID"

      - name: Export IPA
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          xcodebuild -exportArchive \
            -archivePath build/AlienMahjong.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 |
            tee /tmp/alien-upload.log
          grep -q "UPLOAD SUCCEEDED" /tmp/alien-upload.log

      - name: Wait for TestFlight processing
        env:
          ASC_P8_PATH: /tmp/asc_key.p8
        run: |
          . .venv/bin/activate
          python scripts/wait_for_build.py

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlienMahjong-build-${{ github.run_number }}
          path: |
            ios/AlienMahjong/build/export/*.ipa
            ios/AlienMahjong/build/AlienMahjongTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
