name: Himahie
options:
  bundleIdPrefix: jp.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: 83VGKGSQUH
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Himahie:
    type: application
    platform: iOS
    sources:
      - path: Himahie
        excludes:
          - Resources
    resources:
      - Himahie/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.sokosokojikan
        INFOPLIST_FILE: Himahie/Info.plist
    scheme:
      testTargets:
        - HimahieTests
  HimahieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HimahieTests
    dependencies:
      - target: Himahie
