<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ギャルオセロ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2315110f'/%3E%3Ccircle cx='24' cy='32' r='14' fill='%23080808'/%3E%3Ccircle cx='40' cy='32' r='14' fill='%23fff7ec'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="gyaru-othello.css?v=27">
</head>
<body>
  <main class="app-shell">
    <section class="opponent-stage" aria-label="対戦相手">
      <div class="lounge-light" aria-hidden="true"></div>
      <div class="portrait-wrap">
        <img id="opponentImage" class="opponent-image" src="assets/gyaru-othello/opponents/ami.png" alt="対戦相手のポートレート">
        <div id="thinkingAura" class="thinking-aura" aria-hidden="true"></div>
      </div>
      <details id="profilePanel" class="profile-panel">
        <summary>
          <span id="profileName">Amiのプロフィール</span>
          <small>open</small>
        </summary>
        <dl class="profile-grid">
          <div>
            <dt>年齢</dt>
            <dd id="profileAge">22歳</dd>
          </div>
          <div>
            <dt>好きな食べ物</dt>
            <dd id="profileFood">明太チーズもんじゃ</dd>
          </div>
          <div>
            <dt>ハマった理由</dt>
            <dd id="profileReason">友達の家で朝まで打って、角を取った瞬間の気持ちよさに落ちた。</dd>
          </div>
          <div>
            <dt>メモ</dt>
            <dd id="profileNote">勢いで打つけど、勝つときはちゃんと勝つ。</dd>
          </div>
        </dl>
      </details>
      <div id="dialogue" class="dialogue" aria-live="polite">最初は軽くいくね。黒、どうぞ。</div>
    </section>

    <section class="game-table" aria-label="オセロ盤">
      <header class="topbar">
        <div>
          <p class="eyebrow">Gyaru Othello</p>
          <h1>ギャルオセロ</h1>
        </div>
        <div class="scoreboard" aria-label="スコア">
          <div><span class="stone black"></span><strong id="blackScore">2</strong><small>あなた</small></div>
          <div><span class="stone white"></span><strong id="whiteScore">2</strong><small>ギャル</small></div>
        </div>
      <div class="match-strip">
        <div class="opponent-picker" id="opponentPicker">
          <span class="picker-label">対戦相手</span>
          <button id="opponentPickerButton" class="picker-button" type="button" aria-haspopup="listbox" aria-expanded="false">
            <img id="opponentPickerImage" src="assets/gyaru-othello/opponents/ami-neutral.jpg" alt="">
            <span id="opponentPickerText">Ami / Lv.1</span>
          </button>
          <div id="opponentPickerMenu" class="picker-menu" role="listbox" aria-label="対戦相手を選ぶ"></div>
        </div>
        <div class="turn-pill">
          <span id="turnStone" class="stone black"></span>
          <span id="turnText">あなたの番</span>
        </div>
        <button id="hintBtn" class="icon-btn" type="button" title="おすすめ手">?</button>
        <button id="undoBtn" class="icon-btn" type="button" title="1手戻す">&#8630;</button>
        <button id="resetBtn" class="text-btn" type="button">新局</button>
      </div>
      </header>

      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="8x8 オセロ盤"></div>
        <div id="hand" class="gal-hand" aria-hidden="true">
          <img src="assets/gyaru-othello/placing-hand.png" alt="">
        </div>
        <div id="resultOverlay" class="result-overlay" aria-live="polite">
          <div class="result-card">
            <p>対局終了</p>
            <h2 id="resultTitle">勝負あり</h2>
            <span id="resultScore">黒 0 - 白 0</span>
            <blockquote id="resultQuote" class="result-quote"></blockquote>
            <button id="againBtn" type="button">もう一局</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="gyaru-othello.js?v=27"></script>
</body>
</html>
